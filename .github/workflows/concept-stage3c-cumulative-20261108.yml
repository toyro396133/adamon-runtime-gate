          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.4'
      - name: Resume seed17 through 10000 cumulative optimizer steps
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c968aec982e2397fa2f59992aef7ddcaa6b1995b"
          prev=$(find ../../prior -type f -name 'stage3c-seed-17-step-7500.pt' | head -1)
          test -s "$prev"
          test -s "$prev.stage3c.pt"
          python -u -m research.neural_units.train_stage3c_order \
            --seed 17 --resume-model "$prev" --resume-state "$prev.stage3c.pt" \
            --legacy-train UNUSED_DURING_RESUME --steps-until 10000 \
            --output results/stage3c-seed-17
      - name: Independent final sealed TEST and HOLDOUT for seed17
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          prior=$(find ../../historic-train -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          test -s "$prior"
          model="results/stage3c-seed-17/stage3c-seed-17-step-10000.pt"
          python -u -m research.neural_units.evaluate_stage3c_order \
            --seed 17 --model "$model" --state "$model.stage3c.pt" \
            --legacy-train "$prior" \
            --output "results/stage3c-seed-17/sealed_evaluation.json"
      - name: Persist trained seed17 cumulative 10000 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-seed-17-step-10000
          path: |
            source/concept-discovery-v2/results/stage3c-seed-17/*.pt
            source/concept-discovery-v2/results/stage3c-seed-17/*.json
          if-no-files-found: warn
          retention-days: 90
