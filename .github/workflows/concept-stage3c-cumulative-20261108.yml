      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install PyTorch CPU
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.4'
      - name: Resume seed7 through 2500 cumulative optimizer steps
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c968aec982e2397fa2f59992aef7ddcaa6b1995b"
          prev=$(find ../../prior -type f -name 'stage3c-seed-7-step-1000.pt' | head -1)
          test -s "$prev"
          test -s "$prev.stage3c.pt"
          python -u -m research.neural_units.train_stage3c_order \
            --seed 7 --resume-model "$prev" --resume-state "$prev.stage3c.pt" \
            --legacy-train UNUSED_DURING_RESUME --steps-until 2500 \
