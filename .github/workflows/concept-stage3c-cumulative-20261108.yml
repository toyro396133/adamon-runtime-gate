name: Stage3C cumulative temporal growth from trained Stage3B RAW
on:
  push:
    branches: [ci/concept-stage3c-cumulative-20261108]
    paths: [.github/workflows/concept-stage3c-cumulative-20261108.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  seed7-1000:
    name: Stage3C seed7 cumulative 1000 steps
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Require read-only source access
        env:
          SOURCE_TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
        run: test -n "$SOURCE_TOKEN" || { echo "::error::Missing source read token"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: c968aec982e2397fa2f59992aef7ddcaa6b1995b
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - name: Restore immutable trained Stage3B seed7 RAW artifact
        uses: actions/download-artifact@v4
        with:
          name: concept-stage3b-seed-7-all-evidence
          run-id: 42450228946
          github-token: '${{ github.token }}'
          path: stage3b
      - name: Restore original historical TRAIN references
        uses: actions/download-artifact@v4
        with:
          name: cross-entity-root-PR16-continuations
          run-id: 42423323242
          github-token: '${{ github.token }}'
          path: historic-train
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install PyTorch CPU
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.4'
      - name: Verify source and focused architecture/data tests
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c968aec982e2397fa2f59992aef7ddcaa6b1995b"
          python -m unittest tests.test_stage3c_cumulative -v
          python -m research.neural_units.stage3c_corpus
      - name: Resume seed7 through 1000 cumulative optimizer steps
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c968aec982e2397fa2f59992aef7ddcaa6b1995b"
          mkdir -p raw
          cp "$(find ../../stage3b -type f -name 'stage3b-combined_joint-seed-7-raw.pt' | head -1)" raw/
          cp "$(find ../../stage3b -type f -name 'stage3b-combined_joint-seed-7-raw.reader.pt' | head -1)" raw/
          prior=$(find ../../historic-train -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          test -s "$prior"
          python -u -m research.neural_units.train_stage3c_order \
            --seed 7 --raw-dir raw --legacy-train "$prior" \
            --steps-until 1000 --output results/stage3c-seed-7
      - name: Persist trained seed7 cumulative 1000 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-seed-7-step-1000
          path: |
            source/concept-discovery-v2/results/stage3c-seed-7/*.pt
            source/concept-discovery-v2/results/stage3c-seed-7/*.json
          if-no-files-found: warn
          retention-days: 90
  seed7-2500:
    name: Stage3C seed7 cumulative 2500 steps
    needs: seed7-1000
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
