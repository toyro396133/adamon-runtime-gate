name: IMPORT-V2 pinned source audit (GH-196)
on:
  push:
    branches: [validation/import-v2-5786-20261022]
    paths: [.github/workflows/import-v2-5786-source.yml]
permissions:
  contents: read
concurrency:
  group: import-v2-5786-source
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: import_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d import_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMPORT_V2_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/import_v2_test
    steps:
      - name: Require existing private source read token
        env:
          SOURCE_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: test -n "$SOURCE_TOKEN" || { echo 'ENVIRONMENT missing read token'; exit 2; }
      - name: Checkout immutable private source
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 4e0949f1bf186f54c7a4e953ee6a945a344abd26
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Verify exact source and source tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "4e0949f1bf186f54c7a4e953ee6a945a344abd26"
          test "$(git rev-parse HEAD:apps/active/Tables)" = "20ef11703f902b4cba9cdc607ce0003e8c3d9a54"
          mkdir -p "$RUNNER_TEMP/import-v2-private"
          echo "Code source 4e0949f1bf186f54c7a4e953ee6a945a344abd26; source tree pinned; read only; no database." >> "$GITHUB_STEP_SUMMARY"
      - name: Strict parser and year isolation contract tests
        working-directory: source
        run: |
          python - <<'PY'
          import io, os, re, unittest
          suite = unittest.defaultTestLoader.discover('tests/import-v2')
          result = unittest.TextTestRunner(stream=io.StringIO()).run(suite)
          complete = result.wasSuccessful() and result.testsRun == 24 and not result.skipped
          line = f"Source/staging contracts: run={result.testsRun}, failed={len(result.failures)}, errors={len(result.errors)}, skipped={len(result.skipped)}, complete={complete}"
          print(line)
          for _, trace in result.failures + result.errors:
              codes = re.findall(r'SQL_CONTRACT: ([A-Z_]+)', trace)
              if codes:
                  print('Synthetic SQL diagnostic:', codes[-1])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(line + '\n')
          raise SystemExit(0 if complete else 1)
          PY
      - name: Verify all 55 raw sources and publish aggregate year impact only
        working-directory: source
        run: |
          python scripts/import-v2/audit_source.py --source-root apps/active --output "$RUNNER_TEMP/import-v2-private/metadata.json" > "$RUNNER_TEMP/import-v2-private/result.json"
          cat "$RUNNER_TEMP/import-v2-private/result.json"
          cat "$RUNNER_TEMP/import-v2-private/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private source and outputs
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/import-v2-private"
          echo "Private source and raw output removed; no artifacts uploaded." >> "$GITHUB_STEP_SUMMARY"
