name: GH168 isolated acceptance (pinned private PR SHA)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gh168-merge-gate-20261108.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gh168-pinned-acceptance
  cancel-in-progress: false
jobs:
  focused-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: 3e704722978aa86a012eb9673ca297d2a97fa202
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/gh168_test
      PEOPLE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/gh168_test
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
      NEXTAUTH_SECRET: ephemeral-ci-only-no-real-session
      AUTH_SECRET: ephemeral-ci-only-no-real-session
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: gh168_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gh168_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Ensure existing private-read token
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN" || { echo "ENVIRONMENT: CHACHAM_LEV_READ_TOKEN missing"; exit 2; }
      - name: Checkout pinned private source
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 3e704722978aa86a012eb9673ca297d2a97fa202
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-source
      - name: Verify immutable SHA
        working-directory: private-source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install frozen private dependencies
        working-directory: private-source
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma
        working-directory: private-source
        run: pnpm exec prisma generate
      - name: Apply schema to disposable PostgreSQL only
        working-directory: private-source
        run: pnpm exec prisma db push --skip-generate
      - name: Focused GH168 regressions
        working-directory: private-source
        run: pnpm exec vitest run src/actions/peopleManagementActions.search.test.ts src/components/RelationshipMapModal.test.tsx src/components/DonationsTab.test.tsx src/core/providers.tenant.test.tsx src/lib/people-fetch-limits.test.ts
      - name: Prepare synthetic S3 event test evidence directory
        run: mkdir -p "$RUNNER_TEMP/s3-private"
      - name: Full unit suite
        working-directory: private-source
        run: pnpm exec vitest run --testTimeout=30000
      - name: Check TypeScript
        working-directory: private-source
        run: pnpm exec tsc --noEmit
      - name: Lint
        working-directory: private-source
        run: pnpm run lint
      - name: Next.js build
        working-directory: private-source
        run: pnpm run build
      - name: Git diff check
        working-directory: private-source
        run: git diff --check
      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/private-source"
