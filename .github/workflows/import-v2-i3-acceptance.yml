name: Chacham Lev IMPORT-V2 I3 isolated acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-v2-i3-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-v2-i3-realpg-acceptance
  cancel-in-progress: false

jobs:
  i3-native:
    name: I3 native PG ${{ matrix.pg }} + Python + TypeScript + Build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: import_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d import_v2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      ACCEPTED_TEST_SHA: 6e3ddfc44fc5e1d4f653eb4d3b75af371f393000
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/import_v2_test
      NEXTAUTH_SECRET: disposable-ci-nextauth-secret-no-real-users
      AUTH_SECRET: disposable-ci-auth-secret-no-real-users
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Require pre-existing authorized private read secret
        env:
          READ_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo 'ENVIRONMENT: private source token unavailable'
            exit 2
          fi

      - name: Checkout exact private PR SHA, without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 6e3ddfc44fc5e1d4f653eb4d3b75af371f393000
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-source

      - name: Assert exact private HEAD
        working-directory: private-source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ACCEPTED_TEST_SHA" || exit 4
          echo "Pinned candidate: $ACCEPTED_TEST_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frozen private dependencies
        working-directory: private-source
        run: pnpm install --frozen-lockfile

      - name: Python focused I3 pure writer/plan tests
        working-directory: private-source
        run: python3 -m unittest discover -s tests/import-v2 -p 'test_person*.py' -v

      - name: I2 accepted-reference regression suite (synthetic only)
        working-directory: private-source
        run: python3 -m unittest discover -s tests/import-v2 -p 'test_reference*.py' -v

      - name: Generate Prisma client
        working-directory: private-source
        run: pnpm exec prisma generate

      - name: Create disposable native PG schema
        working-directory: private-source
        run: pnpm exec prisma db push --skip-generate

      - name: Native PostgreSQL transaction rollback, concurrent retry, protected I2 guard
        working-directory: private-source
        run: node tests/import-v2/i3_native_pg_acceptance.mjs

      - name: PGlite-focused authorized source reader and negative tests
        working-directory: private-source
        run: |
          pnpm add --save-dev --lockfile=false @electric-sql/pglite@0.5.12
          python3 tests/import-v2/identity_fixture.py "$RUNNER_TEMP/i3-small.json"
          pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "$RUNNER_TEMP/i3-schema.sql"
          pnpm exec tsx tests/import-v2/identity_sql_reader_rehearsal.ts "$RUNNER_TEMP/i3-schema.sql" "$RUNNER_TEMP/i3-small.json"
          rm -f "$RUNNER_TEMP/i3-small.json"

      - name: Verify external preflight syntax (no credentials, no approvals)
        working-directory: private-source
        run: node --check scripts/import-v2/i3_apply_preflight.mjs

      - name: Full project TypeScript
        working-directory: private-source
        run: pnpm exec tsc --noEmit

      - name: Full Next.js production build
        working-directory: private-source
        run: pnpm run build

      - name: Always record bounded acceptance
        if: always()
        shell: bash
        run: |
          echo "## I3 isolated acceptance - PostgreSQL ${{ matrix.pg }}" >> "$GITHUB_STEP_SUMMARY"
          echo "PR228 exact SHA: $ACCEPTED_TEST_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Only generated synthetic identities; real people APPLY: never" >> "$GITHUB_STEP_SUMMARY"
          echo "No Neon or Production connections" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout and generated fixture
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/private-source"
          rm -f -- "$RUNNER_TEMP/i3-small.json" "$RUNNER_TEMP/i3-schema.sql"

  i3-auth-browser:
    name: I3 real NextAuth + Chromium + synthetic source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: i3_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d i3_browser_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      ACCEPTED_TEST_SHA: 6e3ddfc44fc5e1d4f653eb4d3b75af371f393000
      DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/i3_browser_test
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_DEV_BYPASS_AUTH: 'false'
    steps:
      - name: Verify pre-existing private read token
        env:
          READ_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout pinned private source for browser validation
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 6e3ddfc44fc5e1d4f653eb4d3b75af371f393000
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-source

      - name: Verify exact private source commit
        working-directory: private-source
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_TEST_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Generate distinct disposable session, evidence and login credentials
        shell: bash
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "I3_SOURCE_EVIDENCE_MAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Install private pinned dependencies
        working-directory: private-source
        run: pnpm install --frozen-lockfile

      - name: Create disposable PostgreSQL schema
        working-directory: private-source
        run: pnpm exec prisma db push --skip-generate

      - name: Generate Prisma
        working-directory: private-source
        run: pnpm exec prisma generate

      - name: Seed synthetic NextAuth accounts only
        working-directory: private-source
        run: pnpm exec tsx scripts/e2e/seed-mobile-system.ts

      - name: Seed private synthetic I3 source snapshots, quarantine and history
        working-directory: private-source
        run: node tests/import-v2/i3_browser_seed.mjs

      - name: Build actual Next.js app
        working-directory: private-source
        run: pnpm run build

      - name: Install Playwright and Chromium for disposable runner
        working-directory: private-source
        run: |
          pnpm add --save-dev --lockfile=false @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start the real production-mode app against disposable PG
        working-directory: private-source
        shell: bash
        run: |
          pnpm exec next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/i3-next-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/i3-next-server.pid"
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Local NextAuth app did not become ready"
          exit 1

      - name: Real Chromium NextAuth roles, tenant, quarantine, 65-fields, pagination
        working-directory: private-source
        run: pnpm exec playwright test e2e/import-v2-i3.spec.ts --reporter=line

      - name: Summarize test boundary
        if: always()
        shell: bash
        run: |
          echo "## I3 real Chromium and NextAuth" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact private PR228 SHA: $ACCEPTED_TEST_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No Active source and no Neon; synthetic accounts only" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all private source and browser recordings without uploading artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/private-source"
          rm -f -- "$RUNNER_TEMP/i3-next-server.log" "$RUNNER_TEMP/i3-next-server.pid"
