name: Concept Lab stage2 protected GRU semantic A0 A1 B
on:
  push:
    branches: [ci/concept-semantic-gru-stage2-20261108]
    paths: [.github/workflows/concept-semantic-gru-stage2-20261108.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  semantic-stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Confirm existing private checkout authorization
        env: {TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'}
        run: 'test -n "$TOKEN" || { echo "::error::Missing existing repo read token"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: 5b7533f9b527467f2f57a00bcc9a232d2545f1f6
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: cross-entity-root-PR16-continuations
          run-id: 42423323242
          github-token: '${{ github.token }}'
          path: historic-train
      - uses: actions/download-artifact@v4
        with:
          name: concept-cross-entity-2600-protected-seed-7-17
          run-id: 42433021927
          github-token: '${{ github.token }}'
          path: pr22-original
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU neural and semantic teacher dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scikit-learn 'sentence-transformers>=3,<6'
      - name: Three focused neural/semantic checks
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5b7533f9b527467f2f57a00bcc9a232d2545f1f6"
          python -m unittest tests.test_semantic_stage2 -v
      - name: Continue same GRU with A0 / A1 / B from PR22 exact checkpoints
        working-directory: source/concept-discovery-v2
        env:
          HF_HUB_ETAG_TIMEOUT: '15'
          HF_HUB_DOWNLOAD_TIMEOUT: '45'
          TOKENIZERS_PARALLELISM: 'false'
        shell: bash
        run: |
          set -euo pipefail
          prior=$(find ../../historic-train -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          test -s "$prior" || { echo "::error::Missing historic TRAIN dataset"; exit 1; }
          test "$(find ../../pr22-original -type f -name 'continued-shared-structure-seed-*.pt' | wc -l)" -eq 2
          python -u -m research.neural_units.train_semantic_stage2 \
            --checkpoints ../../pr22-original --legacy-train "$prior" \
            --output results/semantic-stage2 --steps 40
          test "$(find results/semantic-stage2 -type f -name 'semantic-stage2-*.pt' | wc -l)" -eq 6
      - name: Sealed independent semantic evaluation only after all 6 checkpoints
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.neural_units.evaluate_semantic_stage2 \
            --checkpoints results/semantic-stage2 \
            --output results/semantic-stage2/independent_evaluation.json
      - name: Upload all six checkpoints and immutable training/blind reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-stage2-semantic-gru-A0-A1-B-seed7-17
          path: |
            source/concept-discovery-v2/results/semantic-stage2/*.pt
            source/concept-discovery-v2/results/semantic-stage2/*.json
          retention-days: 90
          if-no-files-found: warn
