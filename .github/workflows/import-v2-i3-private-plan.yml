name: IMPORT-V2 I3 private Active plan attestation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-v2-i3-private-plan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-v2-i3-private-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Exact Active bytes - private candidate - aggregates only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PINNED_APP_SHA: 67ba4446841c39e9e4680b7142f84ce02b645241
      PINNED_ACTIVE_SHA: a06a837eaf36b83bc90fb86e2c3732978e29a58f
      TENANT_PRIVATE_BLOB_SHA: 4e2ba0ed4163f50eb1c7daea1ae111a134321118
      TENANT_FILE_SHA256: 9cbc410920c73527bd06d8dd804efeaf92c1637f846e145278d6b4580fe4ec8d
      EXPECTED_PROJECT: fragrant-dream-21113210
      EXPECTED_BRANCH: br-summer-frost-apf4ee36
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Require independent private source checkout credential
        shell: bash
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$PRIVATE_SOURCE_TOKEN" ]; then
            echo "BLOCKED: CHACHAM_LEV_READ_TOKEN missing"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 2; fi

      - name: Checkout pinned private importer (no persisted credentials)
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 67ba4446841c39e9e4680b7142f84ce02b645241
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: importer

      - name: Verify embedded byte-identical Active sources and pinned importer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C importer rev-parse HEAD)" = "$PINNED_APP_SHA" || exit 3
          # Git blob IDs were independently compared with original
          # active@a06a837eaf36b83bc90fb86e2c3732978e29a58f.
          cards="apps/active/Tables/נתונים_טבלאות_מקושרות/תורמים.csv"
          history="apps/active/Tables/נתונים_טבלאות_מקושרות/שינוייםתורמים.csv"
          test "$(git -C importer rev-parse "HEAD:$cards")" = "561957d7da5da2814e87af7af175edb7668f2441" || exit 3
          test "$(git -C importer rev-parse "HEAD:$history")" = "80f36b9ec52c0f0a76cf66f188cf4659880e561e" || exit 3
          test "$(wc -c < "importer/$cards")" -eq 1207345 || exit 3
          test "$(wc -c < "importer/$history")" -eq 5543141 || exit 3
          test "$(sha256sum "importer/$cards" | cut -d' ' -f1)" = "884117113471a43714c658e3485ad692fcd63dda51ac42070d85a3bf013c9cf3" || exit 3
          test "$(sha256sum "importer/$history" | cut -d' ' -f1)" = "1f4791c2370e04886d94a817ea9dd371f12fd7ddbeab534f3fd725d8456cd869" || exit 3
          echo "PINNED_IMPORTER_AND_IDENTICAL_ORIGINAL_ACTIVE_SOURCE_BYTES_VERIFIED"

      - name: Verify real embedded Active source statistics before optional Neon connection
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import sys, json
          from pathlib import Path
          from collections import Counter
          module=Path('importer/scripts/import-v2')
          sys.path.insert(0,str(module.resolve()))
          from audit_source import parse_csv
          from person_plan import build_candidate, text
          from person_classification import OWNER_DECISION
          from reference_plan import numeric_key
          manifest=json.loads((module/'source-manifest.json').read_text())
          schema=json.loads((module/'source-headers.json').read_text())
          meta={Path(x['path']).stem:x for x in manifest['files']}
          source=Path('importer/apps/active/Tables/נתונים_טבלאות_מקושרות')
          cards, repaired=parse_csv((source/'תורמים.csv').read_bytes(),meta['תורמים'],schema['תורמים'])
          history, _=parse_csv((source/'שינוייםתורמים.csv').read_bytes(),meta['שינוייםתורמים'],schema['שינוייםתורמים'])
          candidate=build_candidate(cards,'SOURCE_AUDIT_ONLY_NOT_REAL_TENANT',
                                    owner_decision_ref=OWNER_DECISION)
          assert len(cards)==4999 and len(history)==89745
          assert len(candidate['entries'])==4472 and len(candidate['quarantine'])==527
          assert len(schema['תורמים'])==65
          sourcekeys={r['source_key'] for r in candidate['source_rows']}
          admitted={e['source']['source_key'] for e in candidate['entries']}
          history_refs=[numeric_key(h['קודתורם']) for h in history]
          missing_refs=sum(k is None or not k or k not in sourcekeys for k in history_refs)
          excluded_refs=sum(k in sourcekeys and k not in admitted for k in history_refs)
          key_counts=Counter(h['קוד'].strip() for h in history if h['קוד'].strip())
          name_counts=Counter((text(r['שם']),text(r['משפחה'])) for r in cards
                              if text(r['שם']) and text(r['משפחה']))
          reasons=Counter(e['reason'] for e in candidate['quarantine'])
          summary={
            'step':'VERIFIED_ORIGINAL_ACTIVE_BYTES_SOURCE_ONLY',
            'exact_active_commit':manifest['source_sha'],
            'cards':len(cards),
            'history_rows':len(history),
            'field_count':len(schema['תורמים']),
            'person_candidates':len(candidate['entries']),
            'quarantined_cards':len(candidate['quarantine']),
            'source_key_duplicates':len(cards)-len(sourcekeys),
            'history_unmatched_or_empty_references':missing_refs,
            'history_references_to_quarantined_cards':excluded_refs,
            'history_blank_date_observations':sum(not h['תאריך'].strip() for h in history),
            'history_blank_identifier_observations':sum(not h['קוד'].strip() for h in history),
            'history_duplicate_nonempty_identifiers':sum(c-1 for c in key_counts.values() if c>1),
            'same_normalized_first_last_name_extra_cards':sum(c-1 for c in name_counts.values() if c>1),
            'same_normalized_first_last_name_groups':sum(1 for c in name_counts.values() if c>1),
            'name_partition':candidate['name_partition'],
            'classification_partition':candidate['counts'],
            'quarantine_reasons':dict(sorted(reasons.items())),
            'provider_reference_partition':candidate['provider_endpoint_partition'],
            'known_header_repair_strictly_pinned':repaired,
            'private_tenant_and_full_plan_sha256':'NOT_YET_COMPUTED',
            'data_writes':0,
          }
          print('SOURCE_ONLY_PRIVATE_ACTIVE_AGGREGATE='+json.dumps(summary,sort_keys=True,ensure_ascii=False))
          PY

      - name: Load sealed private Tenant identifier sourced from verified isolated Neon
        shell: bash
        env:
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$PRIVATE_REPO_READ_TOKEN" ] || { echo "PRIVATE_GITHUB_READ_TOKEN_MISSING"; exit 7; }
          # A private unreferenced Git blob was minted from an authenticated
          # read-only Neon connector after exact project/branch/Tenant/User/I2 checks.
          # It is NOT a public workflow input, code literal, log, or issue comment.
          response="$RUNNER_TEMP/i3-tenant-blob-response"
          tenant_file="$RUNNER_TEMP/i3-private-tenant"
          trap 'rm -f "$response"' EXIT
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $PRIVATE_REPO_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/toyro396133/chacham-lev/git/blobs/$TENANT_PRIVATE_BLOB_SHA" \
            --output "$response" || { echo "PRIVATE_TENANT_READ_FAILED"; exit 7; }
          jq -e --arg sha "$TENANT_PRIVATE_BLOB_SHA" \
            '.sha == $sha and .encoding == "base64" and .size > 0 and .size < 256' \
            "$response" >/dev/null || { echo "PRIVATE_TENANT_BLOB_NOT_VERIFIED"; exit 7; }
          jq -r '.content' "$response" | base64 --decode > "$tenant_file"
          chmod 600 "$tenant_file"
          actual="$(sha256sum "$tenant_file" | cut -d' ' -f1)"
          [ "$actual" = "$TENANT_FILE_SHA256" ] || { echo "NEON_TENANT_ATTESTATION_DIGEST_MISMATCH"; exit 7; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'],'i3-private-tenant').read_text()
          if not s.endswith('\n') or len(s)>256 or not s.strip() or '\n' in s.strip():
              raise SystemExit('INVALID_PRIVATE_TENANT_ID')
          PY
          echo "TENANT_BOUND_TO_ISOLATED_NEON_VERIFIED_BY_PRIVATE_BLOB_AND_PINNED_DIGEST"

      - name: Parse verified original raw bytes and generate full private plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          import sys, json, hashlib
          from pathlib import Path
          from collections import Counter
          root=Path('importer/scripts/import-v2')
          sys.path.insert(0,str(root.resolve()))
          from person_intake import from_source_bytes
          from person_plan import canonical_json,digest,public_summary
          active=Path('importer/apps/active/Tables/נתונים_טבלאות_מקושרות')
          tenant=Path(__import__('os').environ['RUNNER_TEMP'],'i3-private-tenant').read_text()
          plan=from_source_bytes((active/'תורמים.csv').read_bytes(),
                                 (active/'שינוייםתורמים.csv').read_bytes(),tenant)
          assert len(plan['source_rows'])==4999
          assert len(plan['entries'])==4472
          assert len(plan['quarantine'])==527
          assert len(plan['history_rows'])==89745
          assert len(plan['source_fields'])==65
          assert plan['field_ledger_entries']==4999*65
          ids=[e['target']['id'] for e in plan['entries']]
          assert len(ids)==len(set(ids)),"DUPLICATE_TARGET_PERSON_ID"
          sourcekeys=[r['source_key'] for r in plan['source_rows']]
          assert len(sourcekeys)==len(set(sourcekeys)),"DUPLICATE_NORMALIZED_SOURCE_KEY"
          canon=set(sourcekeys)
          unmatched=sum(1 for h in plan['history_rows']
                        if not h['source_key'] or h['source_key'] not in canon)
          incomplete=sum(1 for h in plan['history_rows'] if not h['data']['תאריך'].strip())
          history_ids=Counter(h['data']['קוד'].strip() for h in plan['history_rows']
                              if h['data']['קוד'].strip())
          history_duplicate_codes=sum(value-1 for value in history_ids.values() if value>1)
          history_blank_codes=sum(1 for h in plan['history_rows'] if not h['data']['קוד'].strip())
          partition=Counter(e['reason'] for e in plan['quarantine'])
          assert sum(partition.values())==527
          assert set(partition).issubset({'LAST_ONLY','NO_NAMES','FIRST_ONLY'})
          raw=canonical_json(plan).encode('utf-8')
          path=Path(__import__('os').environ['RUNNER_TEMP'],'i3-private-person-plan.json')
          # This sensitive, exact plan exists ONLY on ephemeral protected runner
          # storage; never send it to public logs/artifacts or GitHub repository.
          with path.open('xb') as f: f.write(raw+b'\n')
          path.chmod(0o600)
          # A verified reconstruction must reproduce this exact hash. The
          # private plan is not persisted in a public Actions artifact.
          reconstructed=from_source_bytes((active/'תורמים.csv').read_bytes(),
                                           (active/'שינוייםתורמים.csv').read_bytes(),tenant)
          if digest(reconstructed)!=digest(plan):
              raise RuntimeError('PRIVATE_PLAN_DETERMINISTIC_REGENERATION_FAILED')
          public=public_summary(plan)
          public.update({
            'stage':'PRIVATE_FULL_SOURCE_EXACT_PLAN_ATTESTED_NOT_APPLIED',
            'pinned_active_sha':__import__('os').environ['PINNED_ACTIVE_SHA'],
            'pinned_importer_sha':__import__('os').environ['PINNED_APP_SHA'],
            'history_rows':len(plan['history_rows']),
            'quarantine_reason_counts':dict(sorted(partition.items())),
            'history_reference_missing_or_orphan_count':unmatched,
            'history_missing_date_literal_count':incomplete,
            'history_duplicate_nonempty_codes':history_duplicate_codes,
            'history_blank_codes':history_blank_codes,
            'deterministic_regeneration_sha256':digest(reconstructed),
            'duplicate_source_keys':0,
            'duplicate_person_target_ids':0,
            'plan_byte_count':len(raw),
            'plan_storage':'DETERMINISTIC_REGENERATION_WITH_EXACT_SOURCE_COMMIT_AND_APPROVED_SHA',
            'private_plan_deleted_after_verified_hash':True,
            'temporal_projection':'NONE_ORIGINAL_OBSERVATIONS_ONLY',
          })
          print(json.dumps(public,ensure_ascii=False,sort_keys=True))
          PY

      - name: Remove source, private plan and tenant identifier
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/i3-private-person-plan.json" "$RUNNER_TEMP/i3-private-tenant"
          rm -rf -- "$GITHUB_WORKSPACE/importer"

      - name: Publish aggregate-only job summary
        if: always()
        shell: bash
        run: |
          echo "I3 private plan: immutable source and importer commits pinned; private Neon Tenant ID transferred via unreferenced private Git blob authenticated by exact digest. No Person APPLY or source artifacts." >> "$GITHUB_STEP_SUMMARY"
