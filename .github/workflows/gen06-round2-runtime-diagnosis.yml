name: ADAMON original runtime diagnosis only
on:
  workflow_dispatch:
  push:
    branches:
      - audit/gen06-round2-binary-20261011
    paths:
      - '.github/workflows/gen06-round2-runtime-diagnosis.yml'
      - 'ci/gen06_round2_runtime_probe.py'
permissions:
  contents: read
jobs:
  diagnose-original-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public diagnostic wrapper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: infrastructure
      - name: Checkout pinned private diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: toyro396133/cognitive-zero
          ref: 2551c1de097971037fbad8f4071983f52acabb2c
          token: ${{ secrets.COGNITIVE_ZERO_READ_TOKEN }}
          persist-credentials: false
          path: private-source
          fetch-depth: 1
      - name: Install exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r private-source/requirements-tested.txt
      - name: Read first original object and diagnose baseline only
        id: probe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git -C private-source rev-parse HEAD)" = "2551c1de097971037fbad8f4071983f52acabb2c"
          python infrastructure/ci/gen06_round2_runtime_probe.py private-source
      - name: "Python ${{ steps.probe.outputs.python }} SQLite ${{ steps.probe.outputs.sqlite }} verifier=${{ steps.probe.outputs.verifier_valid }} codes=${{ steps.probe.outputs.verifier_codes }} numeric-difference=${{ steps.probe.outputs.numeric_difference }}"
        run: echo 'DIAGNOSTIC_ONLY_NOT_BINARY_ACCEPTANCE; original-byte SHA/integrity/foreign-keys checked; no private rows published'
      - name: Remove private diagnostic source and bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/private-source"
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'adamon-r2-private-run-*' -exec rm -rf -- '{}' +
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'adamon-independent-binary-audit-*' -exec rm -rf -- '{}' +
