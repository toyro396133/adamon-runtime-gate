name: M2.12 exact candidate closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m212-closure.yml'
      - 'ci/m212_closure.py'

permissions:
  contents: write

concurrency:
  group: m212-closure
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout CI infrastructure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: infrastructure

      - name: Require read token and private source repository
        env:
          READ_TOKEN: ${{ secrets.COGNITIVE_ZERO_READ_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get('READ_TOKEN')
          if not token:
              raise SystemExit('ENVIRONMENT: required read secret is missing')
          req = urllib.request.Request(
              'https://api.github.com/repos/toyro396133/cognitive-zero',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  private = json.load(response).get('private') is True
          except Exception:
              raise SystemExit('ENVIRONMENT: cannot verify private source access') from None
          if not private:
              raise SystemExit('ENVIRONMENT: source repository must remain private')
          PY

      - name: Checkout immutable private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: toyro396133/cognitive-zero
          ref: 33ac75d8fc25b1d5f0d5663b1ac23de88b2e9f2a
          token: ${{ secrets.COGNITIVE_ZERO_READ_TOKEN }}
          persist-credentials: false
          path: private-source
          fetch-depth: 1

      - name: Verify source HEAD immediately
        working-directory: private-source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = 33ac75d8fc25b1d5f0d5663b1ac23de88b2e9f2a
          echo 'Verified source HEAD: 33ac75d8fc25b1d5f0d5663b1ac23de88b2e9f2a' >> "$GITHUB_STEP_SUMMARY"

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Ordered closure with private raw output and heartbeat
        env:
          EVIDENCE_TOKEN: ${{ github.token }}
        shell: bash
        run: python infrastructure/ci/m212_closure.py private-source

      - name: Remove private source and raw evidence
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/private-source"
          rm -rf -- "$RUNNER_TEMP/adamon-private-evidence"
          rm -rf -- /tmp/cognitive-zero-m212-*
