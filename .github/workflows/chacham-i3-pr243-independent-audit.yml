name: PR243 11-finding regression and PG16 full-schema gate
on:
  push:
    branches: [ci/chacham-i3-status-71-20261108]
    paths: [.github/workflows/chacham-i3-pr243-independent-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reviewer
          POSTGRES_PASSWORD: reviewer_local_only
          POSTGRES_DB: audit243
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reviewer -d audit243"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      CANDIDATE_SHA: 20b46c2412e96a66949d77f8b4c5e640c1bcc24e
      DATABASE_URL: postgresql://reviewer:reviewer_local_only@127.0.0.1:5432/audit243
      AUTH_SECRET: review-local-only-secret
      NEXTAUTH_SECRET: review-local-only-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout exact approved private-source SHA
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 20b46c2412e96a66949d77f8b4c5e640c1bcc24e
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify exact SHA
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "PINNED_SHA=$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Install pinned dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Prisma schema validation and generate
        working-directory: source
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Focused R243 regression unit and jsdom tests
        working-directory: source
        run: |
          pnpm exec vitest run src/lib/person-institutional-affiliation.test.ts src/lib/import-v2-connection-review-plan.test.ts src/lib/import-v2-derived-affinities.test.ts src/lib/import-v2-pr243-query-connection.test.ts src/lib/import-v2-legacy-status.test.ts src/lib/import-v2-status-review-plan.test.ts src/actions/personInstitutionalFactsActions.test.ts src/components/import-v2-person-scoped.test.tsx src/actions/importV2LegacyStatusReviewActions.test.ts src/services/I3EducationCorrectionService.test.ts --reporter=verbose
      - name: TypeScript integration
        working-directory: source
        run: pnpm exec tsc --noEmit
      - name: Focused ESLint on changed functional files
        working-directory: source
        run: pnpm exec eslint src/lib/person-institutional-affiliation.ts src/lib/person-connection-view.ts src/lib/import-v2-connection-review-plan.ts src/lib/import-v2-derived-affinities.ts src/lib/people-query.ts src/actions/personInstitutionalFactsActions.ts src/services/I3EducationCorrectionService.ts src/hooks/usePersonScopedResult.ts src/components/LegacyStatusReviewTab.tsx src/components/ComputedInstitutionalLinks.tsx src/components/PersonInstitutionalFactsTab.tsx src/components/people/PeopleToolbar.tsx src/components/people/FiltersDrawer.tsx
      - name: Build full pre-S3 baseline from actual main schema
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:prisma/schema.prisma > "$RUNNER_TEMP/main-schema.prisma"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'main-schema.prisma'
          text=source.read_text()
          match=re.search(r'model AuditLog \{[\s\S]*?\n\}',text)
          if not match: raise RuntimeError('AuditLog block missing')
          block=match.group(0)
          if 'subjectPersonId' not in block: raise RuntimeError('Expected main S3 subject missing')
          block='\n'.join(line for line in block.split('\n') if 'subjectPersonId' not in line and 'AuditLog_address_subject_lookup_idx' not in line)
          text=text[:match.start()]+block+text[match.end():]
          target=Path(os.environ['RUNNER_TEMP'])/'pre-s3-schema.prisma'
          target.write_text(text)
          PY
          pnpm exec prisma migrate diff --from-empty --to-schema-datamodel "$RUNNER_TEMP/pre-s3-schema.prisma" --script > "$RUNNER_TEMP/full-before-s3.sql"
          psql -X -v ON_ERROR_STOP=1 --dbname="$DATABASE_URL" --file="$RUNNER_TEMP/full-before-s3.sql" >/dev/null
      - name: Seed 4472 synthetic people and apply S3 then affiliation migration in exact order
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 --dbname="$DATABASE_URL" <<'SQL'
          INSERT INTO "Tenant" ("id","name","subdomain","createdAt","updatedAt")
          VALUES ('t1','Temporary Tenant 1','test-t1',now(),now()),('t2','Temporary Tenant 2','test-t2',now(),now());
          INSERT INTO "Person" ("id","tenantId","firstName","lastName","type","createdAt","updatedAt")
          SELECT 'mock-' || n, 't1', 'Mock', 'Person', 'DONOR', now(),now()
          FROM generate_series(1,4472) n;
          SQL
          psql -X -v ON_ERROR_STOP=1 --dbname="$DATABASE_URL" --file=prisma/migrations/20261027190000_s3_audit_subject_person_lookup/migration.sql
          psql -X -v ON_ERROR_STOP=1 --dbname="$DATABASE_URL" --file=prisma/migrations/20261108043000_person_institutional_affiliation/migration.sql
          psql -X -v ON_ERROR_STOP=1 --dbname="$DATABASE_URL" -c 'SELECT count(*) AS synthetic_people FROM "Person";'
          pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Native PostgreSQL constraint, validity, audit and rollback probes
        working-directory: source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const db=new pg.Client({connectionString:process.env.DATABASE_URL});
          await db.connect();
          let passed=0;
          async function expectSqlState(sql,params,state){
            await db.query('SAVEPOINT probe');
            try {
              await db.query(sql,params);
              throw new Error('SQL unexpectedly accepted violating statement '+state);
            }catch(err){
              if(err.code!==state)throw err;
              passed++;
            }finally{await db.query('ROLLBACK TO SAVEPOINT probe');}
          }
          const ins=`INSERT INTO "PersonInstitutionalAffiliation"
            ("id","tenantId","personId","kind","role","source","rationale","validFrom","validUntil","decidedById","updatedAt")
            VALUES($1,$2,$3,$4,'GENERAL','manual','reviewed',$5,$6,'actor',now())`;
          try{
            await db.query('BEGIN');
            const first=await db.query(ins,['a','t1','mock-1','AVRECH','2026-01-01',null]);
            if(first.rowCount!==1)throw new Error('Expected first affiliation');
            await expectSqlState(ins,['cross','t2','mock-1','STAFF','2026-01-01',null],'23503');
            await expectSqlState(ins,['overlap','t1','mock-1','AVRECH','2030-01-01',null],'23P01');
            await db.query(ins,['future','t1','mock-1','STAFF','2030-01-01',null]);
            await db.query(`UPDATE "PersonInstitutionalAffiliation" SET "isActive"=false
              WHERE id='future'`);
            await db.query(ins,['future-replacement','t1','mock-1','STAFF','2030-01-01',null]);
            await db.query(ins,['finite','t1','mock-2','AVRECH','2020-01-01','2021-01-01']);
            await db.query(ins,['renew','t1','mock-2','AVRECH','2021-01-01',null]);
            await db.query('UPDATE "PersonInstitutionalAffiliation" SET "isActive"=false WHERE id=$1',['finite']);
            const kept=await db.query('SELECT "validUntil" FROM "PersonInstitutionalAffiliation" WHERE id=$1',['finite']);
            if(kept.rows[0].validUntil?.toISOString().slice(0,10)!=='2021-01-01')throw new Error('Historical date rewritten');
            await db.query(`INSERT INTO "AuditLog" ("id","tenantId","userId","model","recordId","action","subjectPersonId","changes","createdAt")
              VALUES('audit1','t1',null,'PersonInstitutionalAffiliation','a','ASSERTED','mock-1','{}',now())`);
            const verify=await db.query(`SELECT "subjectPersonId" FROM "AuditLog" WHERE id='audit1'`);
            if(verify.rows[0].subjectPersonId!=='mock-1')throw new Error('S3 audit readback failure');
            const n=await db.query('SELECT count(*)::int AS n FROM "Person"');
            if(n.rows[0].n!==4472)throw new Error('Person count changed');
            await db.query('ROLLBACK');
            const after=await db.query('SELECT count(*)::int AS n FROM "PersonInstitutionalAffiliation"');
            if(after.rows[0].n!==0)throw new Error('Rollback left affiliation rows');
            console.log('PASS full-schema S3 before I3, 4472 mock people, tenant FK, exclusion, cancel/renew, audit, rollback. SQL state probes:',passed);
          }catch(err){await db.query('ROLLBACK').catch(()=>{});throw err;}
          finally{await db.end();}
          NODE
      - name: Erase private source checkout
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
