name: Chacham Lev lean validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Private Chacham Lev commit SHA (40 lowercase hex characters)
        required: false
        type: string
      tier:
        description: Focused test depth
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - db
          - schema
          - full
          - all
  push:
    paths:
      - .github/workflows/chacham-lev-lean-validation.yml

permissions:
  contents: read

concurrency:
  group: chacham-lev-lean-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Lean contracts (private source, public sanitized results)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_sha || '850ea7680b1f86f22df6c804dfb14ace07852f80' }}
      TEST_TIER: ${{ github.event_name == 'push' && 'db' || inputs.tier || 'smoke' }}
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      PEOPLE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      PARENTAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      STAGE1_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      AUD1210_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      CORE_B_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      TELEPHONE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      NEXTAUTH_SECRET: synthetic-local-test-secret-only
      AUTH_SECRET: synthetic-local-test-secret-only
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      PARENTAL_NATIVE_CONCURRENCY: '1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: chacham_lev_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chacham_lev_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Validate immutable source and private read-only token
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid source SHA"; exit 2; }
          [[ "$TEST_TIER" == smoke || "$TEST_TIER" == db || "$TEST_TIER" == schema || "$TEST_TIER" == full || "$TEST_TIER" == all ]] || { echo "::error::Invalid tier"; exit 2; }
          test -n "$READ_TOKEN" || { echo "::error::Missing read-only private source access"; exit 2; }

      - name: Checkout public summary helper
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact private source in ephemeral workspace
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Verify checkout commit
        shell: bash
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "::error::Source mismatch"; exit 2; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install locked dependencies (no public logs)
        shell: bash
        working-directory: source
        run: |
          if ! pnpm install --frozen-lockfile > "$RUNNER_TEMP/private-install.log" 2>&1; then
            echo "::error::Dependency installation failed; private diagnostics withheld"
            exit 1
          fi

      - name: Run selected test tiers and record sanitized results
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          failures=0
          last_status=0
          echo "## Chacham Lev lean validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested tier: $TEST_TIER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test database: disposable PostgreSQL 18 on runner loopback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Private test output: never published or uploaded" >> "$GITHUB_STEP_SUMMARY"

          run_private() {
            local label="$1"
            shift
            local started="$SECONDS"
            local rc=0
            "$@" > "$RUNNER_TEMP/private-$label.log" 2>&1 || rc=$?
            last_status="$rc"
            local result=PASS
            if [ "$rc" -ne 0 ]; then
              result=FAIL
              failures=$((failures + 1))
              echo "::error::$label failed with exit $rc; logs withheld for private review"
            fi
            echo "- $label: $result ($((SECONDS - started)) s)" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$TEST_TIER" = smoke ] || [ "$TEST_TIER" = all ]; then
            run_private smoke pnpm run test:smoke
          fi

          if [ "$TEST_TIER" = full ] || [ "$TEST_TIER" = all ]; then
            run_private unit pnpm exec vitest run --exclude=**/*.integration.test.ts --reporter=json --outputFile="$RUNNER_TEMP/private-unit.json"
            node "$GITHUB_WORKSPACE/harness/ci/chacham-lev-vitest-summary.cjs" "$RUNNER_TEMP/private-unit.json" unit | tee -a "$GITHUB_STEP_SUMMARY"
            run_private typecheck pnpm exec tsc --noEmit
            run_private lint pnpm run lint
            run_private build pnpm run build
          fi
          if [ "$TEST_TIER" = db ] || [ "$TEST_TIER" = schema ] || [ "$TEST_TIER" = full ] || [ "$TEST_TIER" = all ]; then
            # Use SQL migrations, never just Prisma db push; emit only fixed-category setup errors.
            # The reviewed preparer applies six telephone migrations, including triggers.
            run_private schema pnpm exec tsx scripts/e2e/prepare-mobile-database.ts
            if [ "$last_status" -eq 0 ]; then
              run_private schema-contract node scripts/e2e/verify-reviewed-sql-schema.mjs
              grep -E '^Schema (verification:|parity phase:)' "$RUNNER_TEMP/private-schema-contract.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
              if [ "$last_status" -eq 0 ] && [ "$TEST_TIER" != schema ]; then
                run_private diagnostic-instrument node "$GITHUB_WORKSPACE/harness/ci/instrument-knowledge.cjs"
                if [ "$last_status" -eq 0 ]; then
                  run_private integration pnpm run test:db
                  grep -E '^SQL suite [0-9]+/[0-9]+: last known cleanup phase=' "$RUNNER_TEMP/private-integration.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
                fi
                grep -E '^SQL suite [0-9]+/[0-9]+: (PASS|FAIL)|^SQL suites: ' "$RUNNER_TEMP/private-integration.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
              fi
            else
              echo "- integration: BLOCKED (schema setup failed)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          test "$failures" -eq 0

      - name: Erase private source and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness"
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( -name 'private-*.log' -o -name 'private-*.json' \) -delete
