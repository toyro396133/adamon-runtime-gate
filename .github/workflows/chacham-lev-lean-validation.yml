name: Chacham Lev lean validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable private Chacham Lev SHA (40 lowercase hex)
        required: false
        type: string
      tier:
        description: Selected validation depth
        required: true
        default: smoke
        type: choice
        options: [smoke, db, schema, full, all]
  push:
    paths:
      - .github/workflows/chacham-lev-lean-validation.yml
      - ci/chacham-lev-public-gate.cjs
      - ci/chacham-lev-public-gate.test.cjs

permissions:
  contents: read
concurrency:
  group: chacham-lev-lean-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Isolated private contracts; public numeric evidence only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_sha || '4caa56eb9c5b478e6b6328b3b88e3821b7da149e' }}
      TEST_TIER: ${{ github.event_name == 'push' && 'all' || inputs.tier || 'smoke' }}
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      PEOPLE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      PARENTAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      STAGE1_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      AUD1210_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      CORE_B_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      TELEPHONE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/chacham_lev_test
      NEXTAUTH_SECRET: synthetic-local-test-secret-only
      AUTH_SECRET: synthetic-local-test-secret-only
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      PARENTAL_NATIVE_CONCURRENCY: '1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: chacham_lev_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chacham_lev_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Suppress PostgreSQL SQL/error statements in public service logs
        shell: bash
        run: |
          # GitHub uploads service container logs, including failing SQL statements.
          # Configure before private queries occur. An unsuccessful hardening is fatal.
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 <<'SQL' > /dev/null
          ALTER SYSTEM SET log_min_messages = 'panic';
          ALTER SYSTEM SET log_min_error_statement = 'panic';
          SELECT pg_reload_conf();
          SQL
          test "$(psql "$DATABASE_URL" -X -Atq -c 'SHOW log_min_error_statement')" = panic
          test "$(psql "$DATABASE_URL" -X -Atq -c 'SHOW log_min_messages')" = panic

      - name: Validate immutable private commit input
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid source reference"; exit 2; }
          [[ "$TEST_TIER" =~ ^(smoke|db|schema|full|all)$ ]] || { echo "::error::Invalid validation tier"; exit 2; }

      - name: Checkout trusted public validation code
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Validate public gate and adversarial fixtures
        run: node harness/ci/chacham-lev-public-gate.test.cjs

      - name: Check private read-only checkout capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN" || { echo "::error::Private source token unavailable"; exit 2; }

      - name: Checkout private commit (temporary, read token only here)
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Verify private immutable commit
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "::error::Source mismatch"; exit 2; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install locked dependencies without logs
        working-directory: source
        shell: bash
        run: |
          if ! pnpm install --frozen-lockfile > "$RUNNER_TEMP/private-install.log" 2>&1; then
            echo "::error::Private dependency install failed; evidence withheld"
            exit 1
          fi

      - name: Execute requested validation and publish only trusted evidence
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          invalid=0
          last_status=0
          last_elapsed=0
          public="$RUNNER_TEMP/validated-summary.md"
          : > "$public"

          run_private() {
            local label="$1"
            shift
            local started=$SECONDS
            local rc=0
            "$@" > "$RUNNER_TEMP/private-$label.log" 2>&1 || rc=$?
            last_status=$rc
            last_elapsed=$((SECONDS-started))
            if ((rc!=0)); then
              failures=$((failures+1))
              echo "::error::$label failed (private output withheld)"
            fi
          }
          numeric_report() {
            local kind="$1" file="$2"
            if ! node "$GITHUB_WORKSPACE/harness/ci/chacham-lev-public-gate.cjs" "$kind" "$file" "$last_status" "$last_elapsed" >> "$public"; then
              invalid=$((invalid+1))
              echo "::error::Invalid or absent $kind evidence; no summary will be published"
            fi
          }
          simple_report() {
            local label="$1"
            echo "- $label: $([[ $last_status == 0 ]] && echo PASS || echo FAIL) exit=$last_status seconds=$last_elapsed" >> "$public"
          }

          if [[ "$TEST_TIER" == db || "$TEST_TIER" == schema || "$TEST_TIER" == full || "$TEST_TIER" == all ]]; then
            run_private migration-negative node --test scripts/e2e/reviewed-sql-migrations.test.mjs
            simple_report migration-negative
          fi
          if [[ "$TEST_TIER" == smoke || "$TEST_TIER" == all ]]; then
            run_private smoke pnpm run test:smoke --reporter=json --outputFile="$RUNNER_TEMP/private-smoke.json"
            numeric_report smoke "$RUNNER_TEMP/private-smoke.json"
          fi
          if [[ "$TEST_TIER" == full || "$TEST_TIER" == all ]]; then
            run_private unit pnpm exec vitest run '--exclude=**/*.integration.test.ts' --reporter=json --outputFile="$RUNNER_TEMP/private-unit.json"
            numeric_report unit "$RUNNER_TEMP/private-unit.json"
            run_private typecheck pnpm exec tsc --noEmit
            simple_report typecheck
            run_private lint pnpm run lint
            simple_report lint
            run_private build pnpm run build
            simple_report build
          fi
          if [[ "$TEST_TIER" == db || "$TEST_TIER" == schema || "$TEST_TIER" == full || "$TEST_TIER" == all ]]; then
            run_private schema-setup pnpm exec tsx scripts/e2e/prepare-mobile-database.ts
            simple_report schema-setup
            if ((last_status==0)); then
              run_private schema env CHACHAM_SCHEMA_REPORT_PATH="$RUNNER_TEMP/private-schema.json" node scripts/e2e/verify-reviewed-sql-schema.mjs
              numeric_report schema "$RUNNER_TEMP/private-schema.json"
              if ((last_status==0)); then
                run_private schema-negative node scripts/e2e/verify-reviewed-sql-schema-negative.mjs
                simple_report schema-negative
              fi
              if ((last_status==0)) && [[ "$TEST_TIER" != schema ]]; then
                run_private integration env CHACHAM_SQL_REPORT_PATH="$RUNNER_TEMP/private-integration.json" pnpm run test:db
                numeric_report integration "$RUNNER_TEMP/private-integration.json"
              fi
            else
              failures=$((failures+1))
            fi
          fi
          if ((invalid==0)); then
            {
              echo '## Chacham Lev validated evidence'
              echo "- Private source SHA: $SOURCE_SHA"
              echo "- Tier: $TEST_TIER"
              cat "$public"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Chacham Lev: public evidence rejected; no partial results published' >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$failures" -eq 0 && test "$invalid" -eq 0

      - name: Erase temporary private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness"
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( -name 'private-*.log' -o -name 'private-*.json' -o -name 'validated-summary.md' \) -delete
