name: Concept Lab Stage2 NLI-distilled GRU with fresh sealed Hebrew evaluation
on:
  push:
    branches: [ci/concept-semantic-gru-stage2-20261108]
    paths: [.github/workflows/concept-semantic-stage2-nli-followup-20261108.yml]
permissions: {contents: read, actions: read}
jobs:
  nli-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check private repository token
        env: {TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'}
        run: 'test -n "$TOKEN" || { echo "::error::Missing configured private read token"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: 7536736758727a3c47795661e29158281925fe21
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: cross-entity-root-PR16-continuations
          run-id: 42423323242
          github-token: '${{ github.token }}'
          path: historic-train
      - uses: actions/download-artifact@v4
        with:
          name: concept-cross-entity-2600-protected-seed-7-17
          run-id: 42433021927
          github-token: '${{ github.token }}'
          path: pr22-original
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU PyTorch / NLI inference / sklearn
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.50,<6' scikit-learn
      - name: Check three focused gradient, native-infer and fresh balanced-data properties
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7536736758727a3c47795661e29158281925fe21"
          python -m unittest tests.test_semantic_stage2 -v
      - name: Six protected GRU continuations, TRAIN-dev-gated NLI for B only
        working-directory: source/concept-discovery-v2
        env:
          HF_HUB_ETAG_TIMEOUT: '15'
          HF_HUB_DOWNLOAD_TIMEOUT: '45'
          TOKENIZERS_PARALLELISM: 'false'
        shell: bash
        run: |
          set -euo pipefail
          prior=$(find ../../historic-train -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          test -s "$prior"
          test "$(find ../../pr22-original -type f -name 'continued-shared-structure-seed-*.pt' | wc -l)" -eq 2
          python -u -m research.neural_units.train_semantic_stage2 \
            --checkpoints ../../pr22-original --legacy-train "$prior" \
            --output results/semantic-stage2-nli --steps 40
          test "$(find results/semantic-stage2-nli -type f -name 'semantic-stage2-*.pt' | wc -l)" -eq 6
      - name: Sealed NEW post-NLI-test with held-out names and phrase families
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.neural_units.evaluate_semantic_stage2 \
            --checkpoints results/semantic-stage2-nli \
            --fresh-blind \
            --output results/semantic-stage2-nli/independent_evaluation.json
      - name: Upload six checkpoints, teacher audit and fresh-blind scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-stage2-nli-fresh-blind-seeds-7-17
          path: |
            source/concept-discovery-v2/results/semantic-stage2-nli/*.pt
            source/concept-discovery-v2/results/semantic-stage2-nli/*.json
          retention-days: 90
          if-no-files-found: warn
