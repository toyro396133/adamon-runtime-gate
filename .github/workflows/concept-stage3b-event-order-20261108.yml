name: Stage3B paired event order and information-bottleneck isolation
on:
  push:
    branches: [ci/concept-stage3b-event-order-20261108]
    paths: [.github/workflows/concept-stage3b-event-order-20261108.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  counterfactual-order:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 17]
    runs-on: ubuntu-24.04
    timeout-minutes: 290
    steps:
      - name: Securely verify existing repository source token
        env:
          SOURCE_TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
        run: test -n "$SOURCE_TOKEN" || { echo "::error::Missing read token"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: dc5051ab0dd71e09b750029b296a8f5b3e2c63ea
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: cross-entity-root-PR16-continuations
          run-id: 42423323242
          github-token: '${{ github.token }}'
          path: historic-train
      - uses: actions/download-artifact@v4
        with:
          name: concept-cross-entity-2600-protected-seed-7-17
          run-id: 42433021927
          github-token: '${{ github.token }}'
          path: pr22-original
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU torch and lexical baseline dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'scikit-learn==1.7.2'
      - name: Focused three tests of actual counterfactual ground truth and gradients
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dc5051ab0dd71e09b750029b296a8f5b3e2c63ea"
          python -m unittest tests.test_stage3b_order -v
          python -m research.neural_units.stage3b_counterfactual_data
      - name: First tiny AB/BA fit, then six PR22-only full arms for this seed
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          prior=$(find ../../historic-train -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          test -s "$prior"
          test "$(find ../../pr22-original -type f -name 'continued-shared-structure-seed-*.pt' | wc -l)" -eq 2
          python -u -m research.neural_units.train_stage3b_order \
            --seed ${{ matrix.seed }} --checkpoints ../../pr22-original \
            --legacy-train "$prior" \
            --output results/stage3b-seed-${{ matrix.seed }}
      - name: Independently open and evaluate never-trained TEST and Holdout
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          prior=$(find ../../historic-train -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          python -u -m research.neural_units.evaluate_stage3b_order \
            --seed ${{ matrix.seed }} \
            --checkpoints results/stage3b-seed-${{ matrix.seed }} \
            --legacy-train "$prior" \
            --output results/stage3b-seed-${{ matrix.seed }}/blind_evaluation.json
      - name: Persist all original, raw, guarded, head and diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-stage3b-seed-${{ matrix.seed }}-all-evidence
          path: |
            source/concept-discovery-v2/results/stage3b-seed-${{ matrix.seed }}/*.pt
            source/concept-discovery-v2/results/stage3b-seed-${{ matrix.seed }}/*.json
          if-no-files-found: warn
          retention-days: 90
