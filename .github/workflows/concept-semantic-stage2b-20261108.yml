name: Concept Lab Stage2B actual infer_local GRU semantic continuation
on:
  push:
    branches: [ci/concept-semantic-infer-local-stage2b-20261108]
    paths: [.github/workflows/concept-semantic-stage2b-20261108.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  stage2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check protected private repo read credential
        env: {TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'}
        run: 'test -n "$TOKEN" || { echo "::error::Missing existing repo token"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: c8f505c2ebd28ff8f70f970de7dd1465d2da524f
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: cross-entity-root-PR16-continuations
          run-id: 42423323242
          github-token: '${{ github.token }}'
          path: historic-train
      - uses: actions/download-artifact@v4
        with:
          name: concept-cross-entity-2600-protected-seed-7-17
          run-id: 42433021927
          github-token: '${{ github.token }}'
          path: pr22-frozen
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU-only prerequisites
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scikit-learn
      - name: Three focused native-path tests
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c8f505c2ebd28ff8f70f970de7dd1465d2da524f"
          python -m unittest tests.test_semantic_stage2b -v
      - name: Protected A0/A1/A2 training from ORIGINAL PR22 checkpoints
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          previous=$(find ../../historic-train -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          test -s "$previous" || { echo "::error::Missing historical TRAIN"; exit 1; }
          test "$(find ../../pr22-frozen -type f -name 'continued-shared-structure-seed-*.pt' | wc -l)" -eq 2
          python -u -m research.neural_units.train_semantic_stage2b \
            --checkpoints ../../pr22-frozen --legacy-train "$previous" \
            --steps 48 --output results/stage2b-native
          test "$(find results/stage2b-native -type f -name 'stage2b-*.pt' | wc -l)" -eq 6
          test -s results/stage2b-native/training.json
      - name: Independent NEW sealed TEST/HOLDOUT after all checkpoints
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.neural_units.evaluate_semantic_stage2b \
            --checkpoints results/stage2b-native \
            --output results/stage2b-native/independent_evaluation.json
      - name: Archive six checkpoints, TRAIN guards, independent metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-stage2b-native-three-arm-7-17
          path: |
            source/concept-discovery-v2/results/stage2b-native/*.pt
            source/concept-discovery-v2/results/stage2b-native/*.json
          if-no-files-found: warn
          retention-days: 90
