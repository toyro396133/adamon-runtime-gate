            --output results/stage3d-seed-7
      - name: Restore original trained 10000 weights for sealed paired comparison
        uses: actions/download-artifact@v4
        with:
          name: stage3c-seed-7-step-10000
          run-id: 42452491645
          github-token: '${{ github.token }}'
          path: baseline
      - name: Independent sealed historical and NEW evaluation
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          baseline=$(find ../../baseline -type f -name 'stage3c-seed-7-step-10000.pt' | head -1)
          test -s "$baseline"
          test -s "$baseline.stage3c.pt"
          legacy=$(find ../../historical -type f -path '*/dataset/corpus/train.jsonl' | head -1)
