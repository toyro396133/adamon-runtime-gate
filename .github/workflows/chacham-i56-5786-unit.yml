name: I5 I6 5786 review regressions
on:
  push:
    branches: ['run/i56-5786-tests-20261108']
    paths: ['.github/workflows/chacham-i56-5786-unit.yml']
permissions: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: d494dd211b7b1ba7f87cbb33999a471cb194f4b1
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            scripts/restore-5786
            scripts/import-v2/audit_source.py
            src
            package.json
            package-lock.json
            vitest.config.ts
            tsconfig.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the pinned code and Python suite
        run: |
          test "$(git rev-parse HEAD)" = "d494dd211b7b1ba7f87cbb33999a471cb194f4b1"
          python3 -m unittest discover -s scripts/restore-5786 -v
      - name: Install the pinned isolated test harness
        run: |
          mkdir -p "$RUNNER_TEMP/i56-unit"
          printf '%s\n' '{"name":"i56-unit","private":true}' > "$RUNNER_TEMP/i56-unit/package.json"
          (cd "$RUNNER_TEMP/i56-unit" && npm install --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund vitest@4.1.7 vite@8.0.14)
          ln -s "$RUNNER_TEMP/i56-unit/node_modules" node_modules
      - name: Run the historical access and assignment suites
        run: |
          cat > .i56-vitest.config.mjs <<'EOF'
          import { fileURLToPath } from 'node:url';
          export default { resolve: { alias: { '@': fileURLToPath(new URL('./src', import.meta.url)) } } };
          EOF
          ./node_modules/.bin/vitest run --config .i56-vitest.config.mjs src/services/AnnualStudentGroupAssignmentService.test.ts src/actions/historicalAnnualGroupAssignmentActions.test.ts
