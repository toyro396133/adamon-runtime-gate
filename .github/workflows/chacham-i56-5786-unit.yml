name: I56 historical events and full rehearsal
on:
  push:
    branches: ['run/i56-5786-tests-20261108']
    paths: ['.github/workflows/chacham-i56-5786-unit.yml']
permissions: {}
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: i56_r2
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/i56_r2
      I56_ASSIGNMENT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 4cbdc7e30f829dabd269fb315a478255326ad582
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            scripts/restore-5786
            scripts/import-v2/audit_source.py
            src
            prisma/schema.prisma
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            next.config.ts
            tsconfig.json
            tailwind.config.js
            postcss.config.mjs
            playwright.config.ts
            e2e/import-v2-i56.spec.ts
            public
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact SHA and Python regressions
        run: |
          test "$(git rev-parse HEAD)" = "4cbdc7e30f829dabd269fb315a478255326ad582"
          python3 -m unittest discover -s scripts/restore-5786 -v
          node --test scripts/restore-5786/neon_preflight.test.mjs
      - name: Install pinned verification dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/i56-r2"
          printf '%s\n' '{"name":"i56-r2","private":true}' > "$RUNNER_TEMP/i56-r2/package.json"
          (cd "$RUNNER_TEMP/i56-r2" && npm install --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund vitest@4.1.7 vite@8.0.14 typescript@5.9.3 @types/node@22 prisma@5.22.0 @prisma/client@5.22.0 next@15.5.18 react@19 react-dom@19 uuid@14.0.0)
          ln -s "$RUNNER_TEMP/i56-r2/node_modules" node_modules
      - name: Generate Prisma and initialize disposable PostgreSQL
        run: |
          ./node_modules/.bin/prisma generate --schema prisma/schema.prisma
          ./node_modules/.bin/prisma db push --schema prisma/schema.prisma --skip-generate
      - name: Type-check the affected modules against generated Prisma types
        run: |
          cat > .i56-auth.d.ts <<'EOF'
          export function verifyAuthToken(roles?: string[], tenantId?: string):
            Promise<{ id: string; role: string; tenantId: string; name?: string | null }>;
          EOF
          cat > .i56-auth-session.d.ts <<'EOF'
          export function auth(): Promise<{ user: { id: string; role: string; tenantId: string } } | null>;
          EOF
          cat > .i56-api-auth.d.ts <<'EOF'
          import type { NextRequest, NextResponse } from 'next/server';
          export function requireApiAuth(request: NextRequest, roles?: string[], tenantId?: string): Promise<NextResponse | null>;
          EOF
          cat > .i56-tenant.d.ts <<'EOF'
          export function getTenantId(): Promise<string>;
          EOF
          cat > .i56-tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022", "module": "ESNext", "moduleResolution": "Bundler",
              "strict": true, "skipLibCheck": true, "noEmit": true,
              "paths": {
                "@/lib/auth-utils": ["./.i56-auth.d.ts"],
                "@/lib/api-auth": ["./.i56-api-auth.d.ts"],
                "@/lib/tenant-context": ["./.i56-tenant.d.ts"],
                "@/auth": ["./.i56-auth-session.d.ts"],
                "@/*": ["./src/*"]
              }
            },
            "files": [
              "src/lib/campaign-context.ts",
              "src/app/api/admin/routing/route.ts",
              "src/actions/c2Actions.ts",
              "src/actions/routeKnowledgeActions.ts",
              "src/services/RoutingEngineService.ts",
              "src/services/AnnualRouteStopService.ts",
              "src/actions/annualGroupAssignmentActions.ts",
              "src/actions/historicalAnnualGroupAssignmentActions.test.ts",
              "src/actions/historicalCampaignEvents.i56.integration.test.ts",
              "src/services/GroupService.ts",
              "src/services/CanonicalGroupAccountService.ts",
              "src/services/AnnualStudentGroupAssignmentService.i56.integration.test.ts"
            ]
          }
          EOF
          ./node_modules/.bin/tsc --project .i56-tsconfig.json
      - name: Run unit and real Prisma regressions
        run: |
          cat > .i56-vitest.config.mjs <<'EOF'
          import { fileURLToPath } from 'node:url';
          export default { resolve: { alias: { '@': fileURLToPath(new URL('./src', import.meta.url)) } } };
          EOF
          ./node_modules/.bin/vitest run --config .i56-vitest.config.mjs src/services/AnnualStudentGroupAssignmentService.test.ts src/actions/historicalAnnualGroupAssignmentActions.test.ts src/services/AnnualRouteCampaignService.test.ts src/services/AnnualStudentGroupAssignmentService.i56.integration.test.ts src/services/AnnualRouteStopService.test.ts src/services/AnnualRouteStopService.order.test.ts src/actions/c2Actions.test.ts src/actions/routeKnowledgeActions.test.ts src/services/DigitalBatonPassService.test.ts
      - name: Rehearse all 3,124 synthetic candidates and restore a recovery database
        env:
          DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/i56_full
          I56_EXACT_SHA: 4cbdc7e30f829dabd269fb315a478255326ad582
          I56_SYNTHETIC_DEBUG: '1'
          I56_POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          I56_FULL_REHEARSAL: '1'
        run: |
          PGPASSWORD=synthetic-only psql -h 127.0.0.1 -U postgres -d i56_r2 -v ON_ERROR_STOP=1 -c 'CREATE DATABASE i56_full'
          ./node_modules/.bin/prisma db push --schema prisma/schema.prisma --skip-generate
          export I56_ARCHIVE_PROOF_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$I56_ARCHIVE_PROOF_KEY"
          export I56_SOURCE_PLAN_PATH="$RUNNER_TEMP/i56-synthetic-observations.json"
          export I56_SYNTHETIC_PLAN_PATH="$I56_SOURCE_PLAN_PATH"
          python3 scripts/restore-5786/full_rehearsal.py
          export I56_SOURCE_PLAN_SHA256="$(sha256sum "$I56_SOURCE_PLAN_PATH" | cut -d' ' -f1)"
          export I56_SOURCE_CAMPAIGN_ID="$(python3 -c "import hashlib; print('i56-synthetic-' + hashlib.md5(b'i56-full-synthetic:5786').hexdigest())")"
          for name in I56_ARCHIVE_PROOF_KEY I56_SOURCE_PLAN_PATH I56_SOURCE_PLAN_SHA256 I56_SOURCE_CAMPAIGN_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          ./node_modules/.bin/vitest run --config .i56-vitest.config.mjs src/actions/historicalCampaignEvents.i56.integration.test.ts
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install browser-test application dependencies
        run: |
          unlink node_modules
          if ! npm install --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund --no-progress @playwright/test@1.55.0 > "$RUNNER_TEMP/i56-npm.log" 2>&1; then
            tail -20 "$RUNNER_TEMP/i56-npm.log"
            pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only > "$RUNNER_TEMP/i56-pnpm.log" 2>&1 || { tail -30 "$RUNNER_TEMP/i56-pnpm.log"; exit 1; }
            pnpm add --save-dev --lockfile=false --ignore-scripts --reporter=append-only @playwright/test@1.55.0 > "$RUNNER_TEMP/i56-pw-deps.log" 2>&1 || { tail -30 "$RUNNER_TEMP/i56-pw-deps.log"; exit 1; }
          fi
      - name: Generate browser-test Prisma client
        run: ./node_modules/.bin/prisma generate --schema prisma/schema.prisma
      - name: Type-check archive history page
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('.i56-tsconfig.json'));
          config.compilerOptions.jsx = 'preserve';
          config.files.push('src/app/(authenticated)/campaigns/history/[campaignId]/page.tsx');
          fs.writeFileSync('.i56-browser-tsconfig.json', JSON.stringify(config));
          EOF
          ./node_modules/.bin/tsc --project .i56-browser-tsconfig.json
      - name: Select an isolated Chromium-based browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "I56_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            cat > .i56-playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './e2e', workers: 1, timeout: 60000,
            use: { baseURL: 'http://127.0.0.1:3000',
              launchOptions: { executablePath: process.env.I56_CHROME_EXECUTABLE,
                chromiumSandbox: false } },
          });
          EOF
            echo 'I56_BROWSER_CONFIG=.i56-playwright.config.mjs' >> "$GITHUB_ENV"
          else
            ./node_modules/.bin/playwright install --with-deps chromium > "$RUNNER_TEMP/i56-chromium.log" 2>&1 || { tail -30 "$RUNNER_TEMP/i56-chromium.log"; exit 1; }
            echo 'I56_BROWSER_CONFIG=playwright.config.ts' >> "$GITHUB_ENV"
          fi
      - name: Verify the Playwright runner can launch the browser
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ executablePath: process.env.I56_CHROME_EXECUTABLE,
            chromiumSandbox: false });
          const page = await browser.newPage();
          await page.setContent('<h1>isolated</h1>');
          if (await page.locator('h1').textContent() !== 'isolated') process.exitCode = 1;
          await browser.close();
          EOF
      - name: Create ephemeral test credentials
        run: |
          for name in NEXTAUTH_SECRET AUTH_SECRET E2E_TEST_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Seed only synthetic users and foreign evidence
        env:
          DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/i56_full
        run: |
          node --input-type=module <<'EOF'
          import { PrismaClient } from '@prisma/client';
          import bcrypt from 'bcryptjs';
          const prisma = new PrismaClient();
          const password = await bcrypt.hash(process.env.E2E_TEST_PASSWORD, 10);
          const tenantId = 'i56-full-synthetic';
          const foreignId = 'i56-browser-foreign';
          await prisma.tenant.update({where:{id:tenantId},data:{status:'Active'}});
          await prisma.tenant.create({data:{id:foreignId,name:'Foreign Synthetic',subdomain:foreignId,status:'Active'}});
          await prisma.user.createMany({data:[
            {phone:'052-1234561',role:'ADMIN',tenantId},
            {phone:'052-1234562',role:'STAFF',tenantId},
            {phone:'052-1234563',role:'ADMIN',tenantId:foreignId},
          ].map((fields,i)=>({name:'Synthetic Test',email:'i56-browser-'+i+'@example.invalid',
            password,isActive:true,...fields}))});
          const campaign = await prisma.campaign.findFirstOrThrow({where:{tenantId}});
          await prisma.person.create({data:{id:'i56-browser-foreign-person',tenantId:foreignId,
            firstName:'Synthetic',lastName:'Foreign',type:'DONOR'}});
          await prisma.auditLog.create({data:{tenantId,model:'I56HistoricalEvent',recordId:campaign.id,
            action:'IMPORT_V2_I56_CANONICAL_REHEARSAL',changes:JSON.stringify({
              person:'i56-browser-foreign-person',kind:'WINDOW_PARTICIPATION',
              disposition:'VERIFIED',phase:'EXECUTION',year:'5786',occurred_at:'2026-01-01T01:00:00',
              window:'i56-foreign-address-should-never-render',
            })}});
          await prisma.$disconnect();
          EOF
      - name: Start the real Next.js server and warm login
        id: web
        env:
          DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/i56_full
          NEXT_PUBLIC_DEV_BYPASS_AUTH: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          ./node_modules/.bin/next dev -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/i56-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/i56-next.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 15 http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            kill -0 "$(cat "$RUNNER_TEMP/i56-next.pid")" || break
            sleep 2
          done
          tail -30 "$RUNNER_TEMP/i56-next.log"
          exit 1
      - name: Real login and archive event visibility
        id: authorized
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          ./node_modules/.bin/playwright test e2e/import-v2-i56.spec.ts --config "$I56_BROWSER_CONFIG" --retries=0 --reporter=line --grep 'authenticated archive' > "$RUNNER_TEMP/i56-authorized.log" 2>&1 || { tail -50 "$RUNNER_TEMP/i56-authorized.log"; exit 1; }
      - name: Real login and tenant / role denial
        if: always() && steps.web.outcome == 'success'
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          ./node_modules/.bin/playwright test e2e/import-v2-i56.spec.ts --config "$I56_BROWSER_CONFIG" --retries=0 --reporter=line --grep-invert 'authenticated archive' > "$RUNNER_TEMP/i56-denied.log" 2>&1 || { tail -50 "$RUNNER_TEMP/i56-denied.log"; exit 1; }
      - name: Classify browser diagnostics without storing page or credential data
        if: failure()
        id: browser_error
        run: |
          mode=unclassified
          logs=("$RUNNER_TEMP/i56-authorized.log" "$RUNNER_TEMP/i56-denied.log" "$RUNNER_TEMP/i56-next.log")
          if grep -qi 'No tests found' "${logs[@]}" 2>/dev/null; then mode=no-tests; fi
          if grep -qiE 'Cannot find (module|package)|ERR_MODULE_NOT_FOUND' "${logs[@]}" 2>/dev/null; then mode=module-resolution; fi
          if grep -qiE 'Executable doesn.t exist|browserType.launch|Missing X server' "${logs[@]}" 2>/dev/null; then mode=browser-launch; fi
          if grep -qi 'SYNTHETIC_BROWSER_PASSWORD_REQUIRED' "${logs[@]}" 2>/dev/null; then mode=password-env; fi
          if grep -qi 'waitForURL' "${logs[@]}" 2>/dev/null; then mode=login-timeout; fi
          if grep -qi 'toHaveCount' "${logs[@]}" 2>/dev/null; then mode=visibility-count; fi
          if grep -qiE 'playwright.*did not expect test|two different versions of @playwright' "${logs[@]}" 2>/dev/null; then mode=runner-version; fi
          echo "reason=$mode" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$mode" > "$RUNNER_TEMP/i56-browser-diagnostic.txt"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.browser_error.outcome == 'success'
        with:
          name: i56-browser-diagnostic-${{ steps.browser_error.outputs.reason }}
          path: ${{ runner.temp }}/i56-browser-diagnostic.txt
          retention-days: 1
      - name: Shut down synthetic test server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/i56-next.pid"; then kill "$(cat "$RUNNER_TEMP/i56-next.pid")" || true; fi
