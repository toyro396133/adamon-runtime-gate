name: I5 I6 5786 review regressions
on:
  push:
    branches: ['run/i56-5786-tests-20261108']
    paths: ['.github/workflows/chacham-i56-5786-unit.yml']
permissions: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: a7129d6052f3e8117e458c9cddc99d4e88e41362
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            scripts/restore-5786
            scripts/import-v2/audit_source.py
            src
            package.json
            package-lock.json
            vitest.config.ts
            tsconfig.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the pinned code and Python suite
        run: |
          test "$(git rev-parse HEAD)" = "a7129d6052f3e8117e458c9cddc99d4e88e41362"
          python3 -m unittest discover -s scripts/restore-5786 -v
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the historical access and assignment suites
        run: npm test -- src/services/AnnualStudentGroupAssignmentService.test.ts src/actions/historicalAnnualGroupAssignmentActions.test.ts
