name: Concept Lab stage1 counterbalanced semantic probes
on:
  push:
    branches: [ci/concept-layer-diagnosis-20261108]
    paths: [.github/workflows/concept-layer-counterbalanced-20261108.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  balanced-semantic-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Verify private source checkout access
        env: {TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'}
        run: test -n "$TOKEN" || { echo "::error::Missing repository read token"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: 243cb7c020f2fa80ff2ea69e194f1919cc729978
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: concept-pr18-encoder-root-protected-continuations
          run-id: 42429916937
          github-token: '${{ github.token }}'
          path: pr20-original
      - uses: actions/download-artifact@v4
        with:
          name: concept-cross-entity-2600-protected-seed-7-17
          run-id: 42433021927
          github-token: '${{ github.token }}'
          path: pr22-original
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen evaluation stack
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scikit-learn
      - name: Counterbalance integrity and frozen four-checkpoint semantic audit
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "243cb7c020f2fa80ff2ea69e194f1919cc729978"
          python -m unittest tests.test_counterbalanced_semantics -v
          python -u -m research.neural_units.evaluate_counterbalanced_semantics \
            --pr20 ../../pr20-original --pr22 ../../pr22-original \
            --output results/semantic-layer-diagnosis/counterbalanced_semantics.json
          test -s results/semantic-layer-diagnosis/counterbalanced_semantics.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-stage1-counterbalanced-semantic-probes
          path: source/concept-discovery-v2/results/semantic-layer-diagnosis/counterbalanced_semantics.json
          if-no-files-found: warn
