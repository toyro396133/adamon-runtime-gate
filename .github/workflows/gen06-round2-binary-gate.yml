name: ADAMON Gen0.6 Round 2 independent binary gate

on:
  workflow_dispatch:
  push:
    branches:
      - audit/gen06-round2-binary-20261011
    paths:
      - '.github/workflows/gen06-round2-binary-gate.yml'
      - 'ci/gen06_round2_binary_gate.py'

permissions:
  contents: read

concurrency:
  group: gen06-round2-independent-binary-gate
  cancel-in-progress: false

jobs:
  verify-frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout public execution infrastructure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: infrastructure

      - name: Require private read-only source access
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.COGNITIVE_ZERO_READ_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, urllib.request
          token = os.environ.get('READ_TOKEN')
          if not token:
              raise SystemExit('ENVIRONMENT: required private-source read secret missing')
          request = urllib.request.Request(
              'https://api.github.com/repos/toyro396133/cognitive-zero',
              headers={'Authorization': 'Bearer ' + token,
                       'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  private = json.load(response).get('private') is True
          except Exception:
              raise SystemExit('ENVIRONMENT: private-source access check failed') from None
          if not private:
              raise SystemExit('ENVIRONMENT: expected source repository is not private')
          print('Private read-only checkout preflight: configured')
          PY

      - name: Checkout exact pinned private audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: toyro396133/cognitive-zero
          ref: 9c1858bd487ae457dddbb196f5283bfbc18a58fe
          token: ${{ secrets.COGNITIVE_ZERO_READ_TOKEN }}
          persist-credentials: false
          path: private-source
          fetch-depth: 1

      - name: Verify immutable audit commit and source lineage
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9c1858bd487ae457dddbb196f5283bfbc18a58fe"
          test -f .github/audit/gen06_round2_binary_verify.py
          test -f docs/gen0_6_round2_audit_repair/sqlite_access_manifest.json
          test -f docs/gen0_6_round2_T2_measurement_evidence.tar.gz
          echo 'Pinned private audit commit checked out.'

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install published verification dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r private-source/requirements-tested.txt

      - name: Run independent immutable evidence checks with private logs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python infrastructure/ci/gen06_round2_binary_gate.py private-source

      - name: Remove private checkout and temporary evidence
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/private-source"
          rm -f -- "$RUNNER_TEMP/adamon-r2-public-sanitized.json"
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'adamon-r2-private-run-*' -exec rm -rf -- '{}' +
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'adamon-independent-binary-audit-*' -exec rm -rf -- '{}' +
