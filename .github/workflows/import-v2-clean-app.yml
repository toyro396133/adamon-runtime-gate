name: IMPORT-V2 clean application browser gate (GH-196)
on:
  push:
    branches: [validation/import-v2-5786-20261022]
    paths: [.github/workflows/import-v2-clean-app.yml]
permissions:
  contents: read
concurrency:
  group: import-v2-clean-app
  cancel-in-progress: false
env:
  SOURCE_SHA: 68c9f4f74617592975e9ad8337552287f6cfaeb9
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  clean-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: import_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d import_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/import_v2_test
      IMPORT_V2_REFERENCE_REHEARSAL: '1'
      NEXTAUTH_SECRET: disposable-synthetic-session-secret-only-no-real-account
      AUTH_SECRET: disposable-synthetic-session-secret-only-no-real-account
    steps:
      - name: Require existing private source read token
        env:
          SOURCE_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
        run: test -n "$SOURCE_TOKEN" || { echo 'ENVIRONMENT missing read token'; exit 2; }
      - name: Checkout immutable private application
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Initialize private output and synthetic credentials
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/import-v2-app-private"
          fixture_password=$(openssl rand -hex 24)
          echo "::add-mask::$fixture_password"
          echo "IMPORT_V2_TEST_PASSWORD=$fixture_password" >> "$GITHUB_ENV"
          echo "Source $SOURCE_SHA; PostgreSQL18 loopback only; synthetic institution/users only." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Install immutable dependencies
        working-directory: source
        run: |
          pnpm install --frozen-lockfile --ignore-scripts > "$RUNNER_TEMP/import-v2-app-private/install.log" 2>&1
          echo "Frozen dependency install PASS." >> "$GITHUB_STEP_SUMMARY"
      - name: Install browser harness in disposable checkout only
        working-directory: source
        run: |
          pnpm add --save-dev --lockfile=false --ignore-scripts @playwright/test@1.55.0 > "$RUNNER_TEMP/import-v2-app-private/playwright-dependency.log" 2>&1
          pnpm exec playwright install --with-deps chromium > "$RUNNER_TEMP/import-v2-app-private/chromium.log" 2>&1
          echo "Ephemeral Chromium harness PASS; repository lockfile unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Generate client and create current schema in native service
        working-directory: source
        run: |
          pnpm exec prisma generate > "$RUNNER_TEMP/import-v2-app-private/generate.log" 2>&1
          pnpm exec prisma db push --skip-generate > "$RUNNER_TEMP/import-v2-app-private/schema.log" 2>&1
          node tests/import-v2/clean_app_runtime.mjs --seed-only > "$RUNNER_TEMP/import-v2-app-private/seed.json"
          echo "Current schema and exact synthetic 1-Tenant/3-User empty fixture PASS." >> "$GITHUB_STEP_SUMMARY"
      - name: Rehearse all1420 references twice against full Prisma fixture
        working-directory: source
        run: |
          python tests/import-v2/reference_prisma_rehearsal.py > "$RUNNER_TEMP/import-v2-app-private/reference-rehearsal.json"
          cat "$RUNNER_TEMP/import-v2-app-private/reference-rehearsal.json"
          cat "$RUNNER_TEMP/import-v2-app-private/reference-rehearsal.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Build real production application against reference-only fixture
        working-directory: source
        run: |
          pnpm run build > "$RUNNER_TEMP/import-v2-app-private/build.log" 2>&1
          echo "Production build PASS (native isolated database)." >> "$GITHUB_STEP_SUMMARY"
      - name: Browser login all roles and verify canonical reference UI API and institution isolation
        working-directory: source
        run: |
          set +e
          node tests/import-v2/clean_app_runtime.mjs > "$RUNNER_TEMP/import-v2-app-private/result.json" 2>&1
          result=$?
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP'])/'import-v2-app-private/result.json').read_text().splitlines()
          allowed = {'status','stage','code','pages_verified','environment','real_credentials_logins',
                     'original_protected_accounts_tested','reference_api_reads','tenant_isolation',
                     'fixture_accounts_unchanged','business_rows_created_by_read_flow','reference_rows'}
          reports = []
          for line in lines:
              try:
                  row = json.loads(line)
                  if isinstance(row, dict) and row.get('status') in ('PASS','FAIL'):
                      reports.append({k:v for k,v in row.items() if k in allowed})
              except Exception:
                  pass
          summary = reports[-1] if reports else {'status':'FAIL','stage':'REPORT_UNAVAILABLE'}
          rendered = json.dumps(summary)
          print(rendered)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(rendered+'\n')
          PY
          exit "$result"
      - name: Remove private source and raw output
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/import-v2-app-private"
          echo "Private source/raw logs removed; no cache/artifact upload; no Neon/Production access." >> "$GITHUB_STEP_SUMMARY"
