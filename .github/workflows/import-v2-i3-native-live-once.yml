name: I3 isolated native Node Neon live integration (one-off)
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-v2-i3-native-live-once.yml"]

permissions:
  contents: read

concurrency:
  group: i3-native-live-verification-one-off
  cancel-in-progress: false

jobs:
  native-integration:
    name: Execute exact real I3 Node module against isolated Neon backup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PINNED_I3_SHA: 2a329cc347729d5bf519ac6091eb5b3bf4b59019
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PRIVATE_READ_TOKEN: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
      TENANT_PRIVATE_BLOB_SHA: 4e2ba0ed4163f50eb1c7daea1ae111a134321118
      TENANT_FILE_SHA256: 9cbc410920c73527bd06d8dd804efeaf92c1637f846e145278d6b4580fe4ec8d
    steps:
      - name: Confirm existing runtime credentials without revealing secret values
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$PRIVATE_READ_TOKEN" ] || { echo "BLOCKED_PRIVATE_GITHUB_READ_TOKEN_ABSENT"; exit 5; }
          [ -n "$NEON_API_KEY" ] || { echo "BLOCKED_EXISTING_NEON_API_KEY_ABSENT_IN_APPROVED_RUNNER"; exit 6; }
          echo "BOTH_REQUIRED_EXISTING_RUNNER_CREDENTIALS_PRESENT"

      - name: Checkout exact private I3 code at approved SHA
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: 2a329cc347729d5bf519ac6091eb5b3bf4b59019
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: importer

      - name: Validate exact private code commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C importer rev-parse HEAD)" = "$PINNED_I3_SHA" || exit 4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install exact locked private dependencies
        working-directory: importer
        run: pnpm install --frozen-lockfile

      - name: Recover private Neon-bound Tenant key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_file="$RUNNER_TEMP/i3-live-tenant-id"
          response="$RUNNER_TEMP/i3-live-tenant-response"
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $PRIVATE_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/toyro396133/chacham-lev/git/blobs/$TENANT_PRIVATE_BLOB_SHA" \
            --output "$response" || { echo "PRIVATE_TENANT_BLOB_UNAVAILABLE"; exit 5; }
          jq -e --arg sha "$TENANT_PRIVATE_BLOB_SHA" \
            '.sha == $sha and .encoding == "base64" and .size > 0 and .size < 256' \
            "$response" >/dev/null || exit 5
          jq -r '.content' "$response" | base64 --decode > "$secret_file"
          chmod 600 "$secret_file"
          test "$(sha256sum "$secret_file" | cut -d' ' -f1)" = "$TENANT_FILE_SHA256" || {
            echo "PRIVATE_TENANT_DIGEST_MISMATCH"; exit 5;
          }
          echo "CONFIDENTIAL_TENANT_FILE_MATCHES_VERIFIED_NEON_BINDING"

      - name: Execute UNMOCKED verifyNeonFreshRestore with real Neon HTTPS and PostgreSQL
        working-directory: importer
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { verifyNeonFreshRestore } from './scripts/import-v2/i3_neon_restore_proof.mjs';
          const tenantId=readFileSync(process.env.RUNNER_TEMP+'/i3-live-tenant-id','utf8').trim();
          const expected={
            protected_sha256:'23bbbb63a8dfd3092e95ce90df6bfa8edf3b908a16e2c099ea3a735b62130883',
            i2_crosswalk_sha256:'d1af4890663b1549cc72ce14b9df1811b297c5f2335279bf4ab0ff9d944de35e',
            i2_source_sha256:'db2359e992ebc09984ad789480f1c9f8f07b5d295edd5ac64f8506c86dc2dfb8',
          };
          // No test doubles: real module defaults to global fetch and pg Client.
          const verified=await verifyNeonFreshRestore({
            backupId:'br-little-mouse-apwdw1hk', tenantId,
            expected,neonToken:process.env.NEON_API_KEY,
          });
          if(verified!=='NEON_NATIVE_FRESH_RESTORE_VERIFIED_AT_PREFLIGHT')
            throw new Error('NATIVE_LIVE_RESTORE_NOT_ATTESTED');
          console.log('I3_NODE_NATIVE_UNMOCKED_NEON_RESTORE_AND_CONFIRMED_DELETION_PASS');
          NODE

      - name: Remove confidential transient files and checkout
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/i3-live-tenant-id" "$RUNNER_TEMP/i3-live-tenant-response"
          rm -rf -- "$GITHUB_WORKSPACE/importer"
