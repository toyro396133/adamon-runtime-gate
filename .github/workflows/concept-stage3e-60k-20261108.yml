            --output results/stage3e-seed-7
      - name: Restore baseline Stage3D step 40000 for independent paired evaluation
        uses: actions/download-artifact@v4
        with:
          name: stage3d-seed-7-step-40000
          run-id: 42459515344
          github-token: '${{ github.token }}'
          path: baseline
      - name: Independently evaluate unopened TEST/HOLDOUT and free Hebrew cases
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          baseline=$(find ../../baseline -type f -name 'stage3d-seed-7-step-40000.pt' | head -1)
          test -s "$baseline"
          test -s "$baseline.stage3d.pt"
          legacy=$(find ../../historical -type f -path '*/dataset/corpus/train.jsonl' | head -1)
