name: Stage3E cumulative new causal generalization 40k to 60k
on:
  push:
    branches: [ci/concept-stage3e-60k-20261108]
    paths: [.github/workflows/concept-stage3e-60k-20261108.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  validate:
    name: Stage3E pre-training tests and 30k new-pair audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require repository access
        env:
          SOURCE_TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
        run: test -n "$SOURCE_TOKEN" || { echo "::error::Missing read token"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: fe0740a4beee1fb859ca7ee4c2e9c4aacd8edcb0
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned CPU scientific prerequisites
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.4'
      - name: Validate new data and trained-branch contracts, no optimizer step
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fe0740a4beee1fb859ca7ee4c2e9c4aacd8edcb0"
          python -m py_compile research/neural_units/stage3e_corpus.py research/neural_units/train_stage3e_order.py research/neural_units/evaluate_stage3e_order.py research/neural_units/stage3e_free_text.py
          python -m unittest tests.test_stage3e_cumulative -v
          python -m research.neural_units.stage3e_corpus
  seed7-45000:
    name: Stage3E seed7 cumulative to 45000
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Require repository source read access
        env:
          SOURCE_TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
        run: test -n "$SOURCE_TOKEN" || { echo "::error::Missing read token"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: fe0740a4beee1fb859ca7ee4c2e9c4aacd8edcb0
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - name: Restore trained Stage3D seed7 model AND optimizer sidecar
        uses: actions/download-artifact@v4
        with:
          name: stage3d-seed-7-step-40000
          run-id: 42459515344
          github-token: '${{ github.token }}'
          path: prior
      - name: Restore immutable historical training reference corpus
        uses: actions/download-artifact@v4
        with:
          name: cross-entity-root-PR16-continuations
          run-id: 42423323242
          github-token: '${{ github.token }}'
          path: historical
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned CPU torch and numpy
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.3.4'
      - name: Resume trained seed7 40000 -> 45000 without any reset
        working-directory: source/concept-discovery-v2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fe0740a4beee1fb859ca7ee4c2e9c4aacd8edcb0"
          predecessor=$(find ../../prior -type f -name 'stage3d-seed-7-step-40000.pt' | head -1)
          test -s "$predecessor"
          state="$predecessor.stage3d.pt"
          test -s "$state"
          legacy=$(find ../../historical -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          test -s "$legacy"
          python -u -m research.neural_units.train_stage3e_order \
            --seed 7 --resume-model "$predecessor" --resume-state "$state" \
            --legacy-train "$legacy" --steps-until 45000 \
            --output results/stage3e-seed-7
      - name: Archive full trained seed7 45000 model, optimizers, evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3e-seed-7-step-45000
          path: |
            source/concept-discovery-v2/results/stage3e-seed-7/*.pt
            source/concept-discovery-v2/results/stage3e-seed-7/*.json
          if-no-files-found: warn
          retention-days: 90
