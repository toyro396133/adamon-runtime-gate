name: GH238 current-main composition preflight
on:
  push:
    branches: [validation/door-mobile-gh238-20261028]
    paths: [.github/workflows/mobile238-composition-preflight.yml]
permissions:
  contents: read
concurrency:
  group: mobile238-composition-preflight
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAIN_SHA: 0b1bd7a1deed9e8376a8d08c7531f3032263a87e
      SOURCE_SHA: bc57c4611244ec7716bf501a4fe185fa429991fc
      DATABASE_URL: postgresql://postgres@127.0.0.1:55480/dd_work188_test
      DD_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55480/dd_work188_test
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3007
    steps:
      - name: Checkout pinned private source without persisted token
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.CHACHAM_LEV_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify immutable source and prepare private evidence
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "DD_ACCEPTANCE_DIR=$RUNNER_TEMP/work188-private" >> "$GITHUB_ENV"
          echo "DD_PLAYWRIGHT_MODULE=$RUNNER_TEMP/work188-pw/node_modules/playwright" >> "$GITHUB_ENV"
          auth_secret=$(openssl rand -hex 32)
          nextauth_secret=$(openssl rand -hex 32)
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$nextauth_secret"
          echo "AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
          echo "NEXTAUTH_SECRET=$nextauth_secret" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/work188-private"
      - name: Read-only virtual composition without branch or PR merge
        working-directory: source
        shell: bash
        run: |
          set +e
          git merge-tree --write-tree "$MAIN_SHA" "$SOURCE_SHA" > "$DD_ACCEPTANCE_DIR/composition-private.txt" 2>&1
          preflight_exit=$?
          set -e
          export PREFLIGHT_EXIT="$preflight_exit"
          python - <<'PY'
          import json, os, pathlib, re
          directory=pathlib.Path(os.environ["DD_ACCEPTANCE_DIR"])
          lines=(directory/"composition-private.txt").read_text().splitlines()
          code=int(os.environ["PREFLIGHT_EXIT"])
          summary={"kind":"read-only-merge-tree-preflight","source":os.environ["SOURCE_SHA"],"main":os.environ["MAIN_SHA"],"status":"CLEAN" if code==0 else "CONFLICTS" if code==1 else "ERROR","tests":"NOT_RUN","tree":lines[0] if lines and re.fullmatch("[0-9a-f]{40}",lines[0]) else None,"exitCode":code}
          (directory/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          PY
          exit "$preflight_exit"
      - name: Publish sanitized results and encrypt private diagnostics
        if: always()
        shell: bash
        run: |
          echo "## PR188 isolated acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$DD_ACCEPTANCE_DIR/summary.json" ]; then
            cat "$DD_ACCEPTANCE_DIR/summary.json" >> "$GITHUB_STEP_SUMMARY"
            cp "$DD_ACCEPTANCE_DIR/summary.json" "$RUNNER_TEMP/work188-summary.json"
          else
            echo '{"status":"BLOCKED_ENVIRONMENT"}' > "$RUNNER_TEMP/work188-summary.json"
          fi
          cat > "$RUNNER_TEMP/work188-public-cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDKzCCAhOgAwIBAgIUOEEFTQPT4H2UKAJ0vx1z9KzHWIAwDQYJKoZIhvcNAQEL
          BQAwJTEjMCEGA1UEAwwabW9iaWxlMjM4LXByaXZhdGUtZXZpZGVuY2UwHhcNMjYx
          MDI4MDI1ODE0WhcNMjYxMTA0MDI1ODE0WjAlMSMwIQYDVQQDDBptb2JpbGUyMzgt
          cHJpdmF0ZS1ldmlkZW5jZTCCASIwDQYJKoZIhvcNAQEBBQADggEPADCCAQoCggEB
          AKK6C9IPkqyzWFrCfER2XAcd5QmJKAk5UyVfzQdS8ei8nJcYRUx1X/1E/nmiE6sD
          KDPaKaXXLftRLCBfyJVfjQKzOmouo83FV6D/O+hL+BCEd6V5KP8iZpo2p7lUiV0s
          18fHsAZnhD0+4i24fEwlybrcEmQpbpq8qhsskZwOyoCAKsl/ruj8XNeVj8u3ixwj
          iE/5l9ccuNX4edSmaaAWEZubnKXYA0uAFDl0TTkdVFnFuFd3m09hAoLNUUUwwSLM
          4XCnaws9DgC6I56rwVxmpOL4L7PbyZjE3udCSDQLcFJbi2tPgoWXJ3yM34HW+ZVH
          UmoY5wilFyZ8kosdwDsparkCAwEAAaNTMFEwHQYDVR0OBBYEFD23Nv0tsJO/cqFy
          rXM4h3d/0sbkMB8GA1UdIwQYMBaAFD23Nv0tsJO/cqFyrXM4h3d/0sbkMA8GA1Ud
          EwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAETYKe2kPJk2EsnjunTaycNo
          pXxW1NZjnlHtELtbn5R5Clmqbcx9H16JhfEdGR/MStXz5E2Q8yCAv5EYHXMLqAn5
          QaxnfhOSpvMKtxs4wP8Sm3WYjVDgB9vnxqczwEawYrU2R+j+bgsIDiCzjizsRUpZ
          c21QkrVd9kWiPZPYBflgu02GA8UzvX4XeRz6+L+6omPLMc2HORCG5CZ1Z55dL4P7
          NK0WqI0Wj1RWsZRO8ig/WLTXeuEu8jhH9OgQUmNCdxD17rjo6WdOrJ+XYwog8H82
          75kQnffttHc7ycDupwmFVqZFUN4814uHuGDKnWU8tQsuH/WyAW+9vvWzreHqFo0=
          -----END CERTIFICATE-----
          CERT
          tar -C "$DD_ACCEPTANCE_DIR" -cf "$RUNNER_TEMP/work188-private.tar" .
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/work188-private.tar" -out "$RUNNER_TEMP/work188-private.enc" -outform DER "$RUNNER_TEMP/work188-public-cert.pem"
      - name: Retain encrypted diagnostics and sanitized summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile238-composition-preflight
          retention-days: 7
          path: |
            ${{ runner.temp }}/work188-summary.json
            ${{ runner.temp }}/work188-private.enc
      - name: Clean ephemeral private source and unencrypted evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          shutil.rmtree(pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'source', ignore_errors=True)
          shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP']) / 'work188-private', ignore_errors=True)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'work188-private.tar').unlink(missing_ok=True)
          PY
