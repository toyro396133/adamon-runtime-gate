name: Concept Lab PR18 guarded GRU-to-root continuation
on:
  push:
    branches: [ci/concept-encoder-root-fix-20261108]
    paths: [.github/workflows/concept-encoder-root-fix-20261108.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  continue-pr18-existing-neural-weights:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Verify private source read token exists
        env: {TOKEN: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'}
        run: 'test -n "$TOKEN" || { echo "::error::Missing read token"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: toyro396133/recursive-concepts-lab
          ref: acd1732a06edfedc698c45e3008681cd3eef47fc
          token: '${{ secrets.RECURSIVE_CONCEPTS_READ_TOKEN }}'
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: cross-entity-root-PR16-continuations
          run-id: 42423323242
          github-token: '${{ github.token }}'
          path: predecessor-PR18
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: CPU-only neural and evaluation prerequisites
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install scikit-learn
      - name: Exactly three targeted tests
        working-directory: source/concept-discovery-v2
        run: |
          test "$(git rev-parse HEAD)" = "acd1732a06edfedc698c45e3008681cd3eef47fc"
          python -m unittest tests.test_encoder_root_continuation -v
      - name: Verify PR18 inputs and TRAIN/SEAL separation
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          cp_dir=../../predecessor-PR18
          test "$(find "$cp_dir" -type f -name 'continued-interentity-seed-*.pt' | wc -l)" -eq 2
          trainfile=$(find "$cp_dir" -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          sealedfile=$(find "$cp_dir" -type f -path '*/sealed/corpus/test.jsonl' | head -1)
          test -s "$trainfile"
          test -s "$sealedfile"
          echo "PR18 sources and held-out sealed corpus found"
      - name: Continue BOTH exact PR18 checkpoints via actual inference readout
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          cp_dir=../../predecessor-PR18
          trainfile=$(find "$cp_dir" -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          dataset=$(dirname "$(dirname "$trainfile")")
          python -u -m research.neural_units.encoder_root_continuation \
            --checkpoints "$cp_dir" --dataset "$dataset" \
            --output results/encoder-root-continuation --steps 42
          test "$(find results/encoder-root-continuation -type f -name 'continued-encoder-root-seed-*.pt' | wc -l)" -eq 2
      - name: FROZEN post-training sealed identity, shared groups, traits and relations
        working-directory: source/concept-discovery-v2
        shell: bash
        run: |
          set -euo pipefail
          cp_dir=../../predecessor-PR18
          trainfile=$(find "$cp_dir" -type f -path '*/dataset/corpus/train.jsonl' | head -1)
          sealedfile=$(find "$cp_dir" -type f -path '*/sealed/corpus/test.jsonl' | head -1)
          dataset=$(dirname "$(dirname "$trainfile")")
          sealed=$(dirname "$(dirname "$sealedfile")")
          python -u -m research.neural_units.evaluate_encoder_root_continuation \
            --predecessors "$cp_dir" --continued results/encoder-root-continuation \
            --dataset "$dataset" --sealed "$sealed" \
            --output results/encoder-root-continuation/independent_sealed_evaluation.json \
            --count 70
      - name: Save BOTH checkpoints and pre/post results even if evaluation failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-pr18-encoder-root-protected-continuations
          path: |
            source/concept-discovery-v2/results/encoder-root-continuation/continued-encoder-root-seed-*.pt
            source/concept-discovery-v2/results/encoder-root-continuation/encoder_root_train_results.json
            source/concept-discovery-v2/results/encoder-root-continuation/independent_sealed_evaluation.json
          if-no-files-found: warn
